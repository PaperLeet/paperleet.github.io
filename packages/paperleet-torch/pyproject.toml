[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperleet-torch"
version = "0.8.0"
description = "A bounded NumPy-backed torch-compatible tensor and autodiff library for Python and Pyodide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
paperleet-torch = "paperleet_torch._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
