[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperleet-torch"
version = "0.15.0"
description = "A bounded NumPy-backed torch-compatible tensor and autodiff library for Python and Pyodide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
paperleet-torch = "paperleet_torch._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperleet_torch = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
