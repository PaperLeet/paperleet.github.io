[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stridetorch"
version = "0.43.0"
description = "A bounded NumPy-backed torch-compatible tensor and autodiff library for Python and Pyodide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
stridetorch = "stridetorch._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stridetorch = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
