# Enable after DNS points to this server and certbot issues this certificate.
server {
    listen 80;
    server_name app.paperleet.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.paperleet.com;
    ssl_certificate /etc/letsencrypt/live/app.paperleet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.paperleet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:18880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }
}
