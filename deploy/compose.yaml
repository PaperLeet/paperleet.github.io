name: paperleet
services:
  web:
    image: paperleet-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PAPERLEET_DOMAIN: ${PAPERLEET_DOMAIN:?Set your public DNS name}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on: [api]
    mem_limit: 256m
    pids_limit: 128
  api:
    image: paperleet-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      PAPERLEET_MODE: hosted
      PAPERLEET_AUTH_MODE: ${PAPERLEET_AUTH_MODE:-institutional}
      PAPERLEET_REGISTRATION_POLICY: ${PAPERLEET_REGISTRATION_POLICY:-invite_only}
      PAPERLEET_BLOCKED_EMAIL_DOMAINS: ${PAPERLEET_BLOCKED_EMAIL_DOMAINS:-}
      PAPERLEET_PUBLIC_URL: https://${PAPERLEET_DOMAIN:?Set your public DNS name}
      PAPERLEET_DATA_DIR: /var/lib/paperleet/data
      PAPERLEET_INVITE_EMAILS: ${PAPERLEET_INVITE_EMAILS:-}
      PAPERLEET_ADMIN_EMAILS: ${PAPERLEET_ADMIN_EMAILS:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      PAPERLEET_JUDGE_URL: http://judge:8766
      PAPERLEET_JUDGE_TOKEN: ${PAPERLEET_JUDGE_TOKEN:?Generate a random judge token}
      PAPERLEET_TRUST_PROXY: "1"
    volumes:
      - app_data:/var/lib/paperleet
    networks: [frontend, judge_internal]
    depends_on: [judge]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import json,os,urllib.request; u=os.environ['PAPERLEET_PUBLIC_URL']; r=urllib.request.Request('http://127.0.0.1:8765/api/health',headers={'Host':u.split('//',1)[1]}); h=json.load(urllib.request.urlopen(r,timeout=8)); assert h['ok'] and h['mode']=='hosted' and h['judge']['ready']"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  judge:
    image: paperleet-judge-manager:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: judge-manager
    restart: unless-stopped
    environment:
      PAPERLEET_JUDGE_TOKEN: ${PAPERLEET_JUDGE_TOKEN:?Generate a random judge token}
      PAPERLEET_JUDGE_IMAGE: paperleet-worker:local
      PAPERLEET_JUDGE_CONCURRENCY: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [judge_internal]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
networks:
  frontend: {}
  judge_internal:
    internal: true
volumes:
  app_data: {}
  caddy_data: {}
  caddy_config: {}
