# Paper numbers are public library IDs; module numbers remain stable CLI IDs.
papers:
  - id: gae
    category: reinforcement-learning
    number: 1
    short_title: GAE
    year: 2016
    tags: [Reinforcement Learning, Advantage Estimation]
    summary: 用指数加权的 TD 残差估计优势，通过 λ 控制偏差与方差。
    summary_en: "Estimate advantages from exponentially weighted TD residuals, with lambda controlling the bias–variance tradeoff."
    scope: 实现 GAE 的反向递推和 episode 边界处理。
    scope_en: "Implement the backward GAE recurrence and episode boundary handling."
    module_ids: [rl/gae]
  - id: ppo
    category: reinforcement-learning
    number: 2
    short_title: PPO
    year: 2017
    tags: [Reinforcement Learning, Policy Optimization]
    summary: 在策略目标中截断概率比，限制过大的策略更新带来的收益。
    summary_en: "Clip probability ratios in the policy objective to limit the incentive for excessively large updates."
    scope: 实现 clipped surrogate 及其梯度行为；价值损失、归一化和统计代码已提供。
    scope_en: "Implement the clipped surrogate and its gradient behavior; value loss, normalization, and diagnostics are supplied."
    module_ids: [rl/ppo_clip]
  - id: dpo
    category: post-training
    number: 3
    short_title: DPO
    year: 2023
    tags: [Preference Learning, Language Models]
    summary: 将偏好对上的隐式奖励差转化为直接优化语言模型的分类目标。
    summary_en: "Turn the implicit reward margin of preference pairs into an objective that directly optimizes a language model."
    scope: 实现偏好损失与隐式奖励；token 对齐和序列 log-prob 计算已提供。
    scope_en: "Implement the preference loss and implicit rewards; token alignment and sequence log-probability calculation are supplied."
    module_ids: [rl/dpo]
  - id: deepseekmath
    category: reinforcement-learning
    number: 4
    short_title: DeepSeekMath · GRPO
    year: 2024
    tags: [Reinforcement Learning, Group Relative Advantages]
    summary: 使用同一问题的一组回答构造相对优势，并通过 GRPO 目标更新策略。
    summary_en: "Construct relative advantages from a group of responses to the same prompt and update the policy with the GRPO objective."
    scope: 选取论文的 GRPO 模块：组内相对优势、截断目标和回答级聚合。
    scope_en: "Focus on the paper's GRPO module: group-relative advantages, clipped objectives, and response-level aggregation."
    module_ids: [rl/grpo]
  - id: dr-grpo
    category: reinforcement-learning
    number: 5
    short_title: Dr. GRPO
    year: 2025
    tags: [Reinforcement Learning, Objective Normalization]
    summary: 分析 GRPO 的长度与难度偏差，并调整优势缩放和损失归一化。
    summary_en: "Analyze length and difficulty biases in GRPO and adjust advantage scaling and loss normalization."
    scope: 实现去除组内标准差缩放与固定生成长度归一化这两处修正。
    scope_en: "Implement two corrections: remove group standard-deviation scaling and normalize by a fixed generation budget."
    module_ids: [rl/dr_grpo]
  - id: ddpm
    category: generative-models
    number: 6
    short_title: DDPM
    year: 2020
    tags: [Diffusion, Denoising]
    summary: 用逐步加噪的前向过程和学习去噪的反向过程构造生成模型。
    summary_en: "Build a generative model from a forward noising process and a learned reverse denoising process."
    scope: 实现闭式前向加噪，以及高斯后验和 epsilon 参数化的反向一步；调度器与采样循环已提供。
    scope_en: "Implement closed-form forward noising, the Gaussian posterior, and an epsilon-parameterized reverse step; schedules and sampling loops are supplied."
    module_ids: [diffusion/schedules, diffusion/ddpm_sampling]
  - id: progressive-distillation
    category: generative-models
    number: 7
    short_title: Progressive Distillation
    year: 2022
    tags: [Diffusion, Parameterization]
    summary: 把教师的两步确定性更新蒸馏为学生的一步更新，逐轮减少采样步数。
    summary_en: "Distill two deterministic teacher steps into one student step, progressively reducing the sampling budget."
    scope: 先实现 v 参数化转换，再推导两步教师到一步学生的蒸馏目标并验证更新。
    scope_en: "Implement v-parameterization conversions, then derive and validate the two-teacher-step to one-student-step distillation target."
    module_ids: [diffusion/param_conversion, diffusion/progressive_distillation]
  - id: ddim
    category: generative-models
    number: 8
    short_title: DDIM
    year: 2021
    tags: [Diffusion, Sampling]
    summary: 使用非马尔可夫采样更新实现跳步生成，并以 eta 控制随机性。
    summary_en: "Use a non-Markovian sampling update to skip timesteps, with eta controlling stochasticity."
    scope: 实现 DDIM 单步更新和干净端点；时间步选择、循环与反演探索代码已提供。
    scope_en: "Implement the DDIM update and clean endpoint; timestep selection, loops, and inversion exploration code are supplied."
    module_ids: [diffusion/ddim]
  - id: flow-matching
    category: generative-models
    number: 9
    short_title: Flow Matching
    year: 2023
    tags: [Flow Matching, Continuous Flows]
    summary: 通过回归条件概率路径的速度场学习连续生成流。
    summary_en: "Learn a continuous generative flow by regressing the velocity field of conditional probability paths."
    scope: 实现条件路径、目标速度和 CFM 回归损失；时间采样、Euler 积分和训练辅助代码已提供。
    scope_en: "Implement the conditional path, target velocity, and CFM regression loss; time sampling, Euler integration, and training helpers are supplied."
    module_ids: [diffusion/flow_matching]
  - id: gspo
    number: 10
    category: reinforcement-learning
    short_title: GSPO
    year: 2025
    tags: [Policy Optimization, Sequence Ratios]
    summary: 在回答级别构造长度归一化的重要性比率，再截断策略目标。
    summary_en: Construct length-normalized sequence importance ratios and clip the policy objective at the response level.
    scope: 实现序列概率比与 GSPO 损失，验证掩码、截断区域和梯度。
    scope_en: Implement sequence ratios and the GSPO loss; test masking, clipping regions, and gradients.
    module_ids: [rl/gspo]
  - id: gkd
    number: 11
    category: post-training
    short_title: GKD · On-policy Distillation
    year: 2023
    tags: [Distillation, Student Rollouts]
    summary: 在学生自己生成的前缀上查询教师分布，减少训练与生成时的分布偏移。
    summary_en: Query the teacher on student-generated prefixes to reduce the mismatch between training and generation.
    scope: 实现学生 rollout 和全词表散度；在小型自回归模型上验证。OPD 在此指 on-policy distillation。
    scope_en: Implement student rollouts and full-vocabulary divergence in a tiny autoregressive model. OPD here means on-policy distillation.
    module_ids: [rl/opd]
  - id: dapo
    number: 12
    category: reinforcement-learning
    short_title: DAPO
    year: 2025
    tags: [Policy Optimization, Dynamic Sampling]
    summary: 通过动态保留有效回答组、非对称截断和 token 级聚合改进策略优化。
    summary_en: Improve policy optimization with informative-group filtering, asymmetric clipping, and token-level aggregation.
    scope: 实现组筛选与 token 级目标；采样系统和分布式训练不在本模块范围。
    scope_en: Implement group filtering and the token-level objective; sampling infrastructure and distributed training are outside this module.
    module_ids: [rl/dapo]
  - id: lora
    number: 13
    category: post-training
    short_title: LoRA
    year: 2022
    tags: [Low-rank Adaptation, Parameter Efficiency]
    summary: 冻结预训练权重，以低秩矩阵乘积学习增量。
    summary_en: Freeze pretrained weights and learn an update through a low-rank matrix product.
    scope: 实现低秩增量和线性前向，验证冻结边界及小型回归学习。
    scope_en: Implement the low-rank update and linear forward pass; verify frozen parameters and a small regression experiment.
    module_ids: [finetuning/lora]
  - id: qlora
    number: 14
    category: post-training
    short_title: QLoRA
    year: 2023
    tags: [Quantization, Low-rank Adaptation]
    summary: 在量化的冻结基座上训练低秩适配器，以减少微调内存。
    summary_en: Train low-rank adapters on a quantized frozen base to reduce fine-tuning memory.
    scope: 实现分块 NF4 量化、反量化与适配器前向；不模拟双重量化或分页优化器。
    scope_en: Implement blockwise NF4 quantization, dequantization, and adapter forward; double quantization and paged optimizers are outside this exercise.
    module_ids: [finetuning/qlora]
  - id: meanflow
    number: 15
    category: generative-models
    short_title: MeanFlow
    year: 2025
    tags: [One-step Generation, JVP]
    summary: 用瞬时速度和平均速度之间的恒等式学习区间流，以一步生成样本。
    summary_en: Learn an interval flow using the identity between instantaneous and average velocities for one-step generation.
    scope: 实现平均流的 JVP 目标和梯度边界，并运行小型生成实验。
    scope_en: Implement the average-flow JVP target and gradient boundaries, then run a small generative experiment.
    module_ids: [diffusion/meanflow]
  - id: jit
    number: 16
    category: generative-models
    short_title: JiT
    year: 2025
    tags: [Denoising, Data Prediction]
    summary: 直接预测干净数据，在不同预测空间和损失空间之间显式转换。
    summary_en: Predict clean data directly and explicitly convert between prediction and loss spaces.
    scope: 实现 x-prediction 到速度的转换与去噪目标，使用论文启发的低维流形嵌入实验。
    scope_en: Implement data-to-velocity conversion and the denoising objective with a paper-derived embedded-manifold experiment.
    module_ids: [diffusion/jit]
  - id: drifting
    number: 17
    category: generative-models
    short_title: Drifting Models
    year: 2026
    tags: [One-step Generation, Distribution Matching]
    summary: 构造吸引真实样本、排斥生成样本的漂移场，并用停止梯度的目标训练生成器。
    summary_en: Construct a drifting field that attracts real samples and repels generated samples, then train a generator against a stopped-gradient target.
    scope: 实现漂移场与停止梯度损失，在小型二维分布上验证生成器行为。
    scope_en: Implement the drifting field and stopped-gradient loss, and verify generator behavior on a small two-dimensional distribution.
    module_ids: [diffusion/drifting]
  - id: dmd
    number: 18
    category: generative-models
    short_title: DMD
    year: 2024
    tags: [Distillation, Score Matching]
    summary: 用真实分布和生成分布的 score 差构造生成器的分布匹配更新。
    summary_en: Use the score difference between real and generated distributions to construct a distribution-matching generator update.
    scope: 实现 score 差目标与配对回归项，用解析双峰分布检查模式覆盖。
    scope_en: Implement the score-difference target and paired regression term; inspect mode coverage using an analytic bimodal distribution.
    module_ids: [diffusion/dmd]
  - id: dmd2
    number: 19
    category: generative-models
    short_title: DMD2
    year: 2024
    tags: [Distillation, Two-timescale Updates]
    summary: 通过更快的假 score 更新和对抗辅助训练，去除 DMD 的配对回归要求。
    summary_en: Remove DMD's paired-regression requirement using faster fake-score updates and adversarial auxiliary training.
    scope: 实现双时间尺度更新与辅助目标，在小型实验中验证参数更新边界。
    scope_en: Implement two-timescale updates and auxiliary objectives; verify parameter-update boundaries in a small experiment.
    module_ids: [diffusion/dmd2]
  - id: consistency
    number: 20
    category: generative-models
    short_title: Consistency Models
    year: 2023
    tags: [Consistency, Distillation]
    summary: 让同一生成轨迹上的不同噪声状态映射到一致的干净端点。
    summary_en: Map noisy states along the same generative trajectory to a consistent clean endpoint.
    scope: 实现边界参数化和相邻时刻的一致性蒸馏损失。
    scope_en: Implement the boundary parameterization and adjacent-time consistency-distillation loss.
    module_ids: [diffusion/consistency]
  - id: transformer
    number: 21
    category: architecture
    short_title: Transformer
    year: 2017
    tags: [Attention, Normalization, Positional Encoding, Sequence Models]
    summary: 用多头注意力组合序列信息，结合位置编码、逐位置前馈网络和残差归一化构成 Transformer。
    summary_en: Combine sequence information through multi-head attention, positional encoding, position-wise feed-forward networks, and residual normalization.
    scope: 分别实现缩放点积注意力、多头注意力、LayerNorm 与 Add & Norm、正弦位置编码及逐位置前馈网络；每个模块独立练习，辅助代码与小实验已提供。
    scope_en: Independently implement scaled dot-product attention, multi-head attention, LayerNorm and Add & Norm, sinusoidal positional encoding, and position-wise feed-forward networks; helpers and small experiments are supplied.
    module_ids: [architecture/attention, architecture/multihead_attention, architecture/layer_norm, architecture/positional_encoding, architecture/positionwise_ffn]
  - id: adamw
    number: 22
    category: optimization
    short_title: AdamW
    year: 2019
    tags: [Optimization, Weight Decay]
    summary: 将权重衰减与自适应梯度更新分离。
    summary_en: Decouple weight decay from the adaptive gradient update.
    scope: 实现矩估计、偏差修正与解耦权重衰减的一步更新。
    scope_en: Implement moment estimates, bias correction, and a decoupled weight-decay step.
    module_ids: [optimization/adamw]
  - id: flash-attention
    number: 23
    category: ai-infra
    short_title: FlashAttention
    year: 2022
    tags: [Attention, Online Softmax]
    summary: 利用在线 softmax 分块精确累积注意力，避免物化完整注意力矩阵。
    summary_en: Accumulate exact attention in blocks with online softmax without materializing the full attention matrix.
    scope: 实现分块递推与重缩放。这是 CPU 算法练习，不评价 GPU kernel 性能。
    scope_en: Implement blockwise recurrence and rescaling. This CPU algorithm exercise does not benchmark GPU kernels.
    module_ids: [architecture/flash_attention]
  - id: clip
    number: 24
    category: multimodal
    short_title: CLIP
    year: 2021
    tags: [Contrastive Learning, Multimodal]
    summary: 用对称的批内对比损失对齐图像和文本表征。
    summary_en: Align image and text representations using a symmetric in-batch contrastive objective.
    scope: 实现特征归一化、温度缩放和双向对比损失，使用小型配对检索实验。
    scope_en: Implement feature normalization, temperature scaling, and bidirectional contrastive loss with a tiny paired-retrieval experiment.
    module_ids: [representation/clip]
  - id: glm-5
    number: 25
    category: architecture
    short_title: GLM-5
    year: 2026
    tags: [Technical Report, Muon, Asynchronous RL]
    summary: 从 GLM-5 技术报告中提取按注意力头正交化的优化更新，以及异步强化学习的重要性采样修正。
    summary_en: Extract head-wise orthogonalized updates and asynchronous-RL importance corrections from the GLM-5 technical report.
    scope: 两题分别实现 Muon Split 的逐头正交化与双边重要性采样策略损失，使用可复现的 CPU 教学实验。
    scope_en: Implement Muon Split's per-head orthogonalization and a double-sided importance-sampling policy loss in two independent CPU exercises.
    module_ids: [optimization/muon_split, rl/glm5_offpolicy]
  - id: kimi-k3
    number: 26
    category: architecture
    short_title: Kimi K3
    year: 2026
    tags: [Technical Report, Linear Attention, Attention Residuals, Activation]
    summary: 实现 Kimi K3 在序列、深度和激活值三个维度的核心机制：KDA、块级注意力残差与 SiTU-GLU。
    summary_en: >-
      Implement Kimi K3's core mechanisms for sequence mixing, depth aggregation, and bounded activations: KDA, Block AttnRes, and SiTU-GLU.
    scope: 三题分别实现有界衰减与 delta-rule 递推、跨层残差注意力聚合、SiTU 门控激活，并重绘论文中的门函数与激活曲线。
    scope_en: Independently implement bounded decay and delta-rule recurrence, attention over residual blocks, and SiTU gating; recreate the report's decay and activation curves.
    module_ids: [architecture/kimi_kda, architecture/block_attention_residual, architecture/situ_glu]
  - id: opsd
    number: 27
    category: post-training
    short_title: OPSD
    year: 2026
    tags: [Self-Distillation, Causal Alignment, KL Divergence, Clipping]
    summary: 用同一模型的特权上下文教师监督学生自己的轨迹。
    summary_en: Use a privileged-context teacher from the same model to supervise student rollouts.
    scope: 双上下文因果对齐与逐词表项散度截断。
    scope_en: Dual-context causal alignment and pointwise divergence clipping.
    module_ids:
    - finetuning/opsd_alignment
    - finetuning/opsd_clipping
  - id: sdpo
    number: 28
    category: reinforcement-learning
    short_title: SDPO
    year: 2026
    tags: [Reinforcement Learning, Self-Distillation, Feedback, KL Divergence, Top-K]
    summary: 将环境反馈与成功尝试转成逐 token 的自蒸馏监督。
    summary_en: Turn environment feedback and successful attempts into token-level self-distillation.
    scope: 同题反馈路由、reverse KL 与 top-k 尾部概率聚合。
    scope_en: Same-question feedback routing, reverse KL, and top-k tail-mass coarsening.
    module_ids:
    - rl/sdpo_feedback
    - rl/sdpo_topk
  - id: repa
    number: 29
    category: representation
    short_title: REPA
    year: 2025
    tags: [Representation Alignment, Diffusion Transformer, Autograd]
    summary: 将生成模型的中间特征与冻结教师的语义表征对齐。
    summary_en: Align intermediate generative features with a frozen semantic teacher.
    scope: 逐 patch 表征对齐损失与梯度边界。
    scope_en: Patch-wise representation alignment and gradient boundaries.
    module_ids:
    - representation/repa
  - id: rotation-trick
    number: 30
    category: representation
    short_title: Rotation Trick
    year: 2025
    tags: [Vector Quantization, Surrogate Gradients, Geometry]
    summary: 以冻结旋转与缩放构造向量量化的代理梯度。
    summary_en: Use a frozen rotation and scale to construct vector-quantization surrogate gradients.
    scope: 保持量化前向值的旋转梯度变换。
    scope_en: Rotation-based gradient transformation with quantized forward values.
    module_ids:
    - representation/rotation_trick
  - id: differential-transformer
    number: 31
    category: architecture
    short_title: Differential Transformer
    year: 2025
    tags: [Attention, Transformer, Autograd]
    summary: 相减两张注意力图以抑制共有噪声。
    summary_en: Subtract two attention maps to suppress common-mode noise.
    scope: 已投影张量上的差分注意力与 lambda 参数化。
    scope_en: Differential attention on projected tensors and lambda parameterization.
    module_ids:
    - architecture/differential_attention
  - id: block-diffusion
    number: 32
    category: generative-models
    short_title: Block Diffusion
    year: 2025
    tags: [Discrete Diffusion, Attention Mask, Language Modeling]
    summary: 以块间自回归和块内扩散结合离散生成。
    summary_en: Combine autoregression across blocks with diffusion within blocks.
    scope: 拼接干净和含噪 token 的单次前向注意力掩码。
    scope_en: Single-forward attention masks for concatenated noisy and clean tokens.
    module_ids:
    - diffusion/block_diffusion
  - id: distillm-2
    number: 33
    category: post-training
    short_title: DistiLLM-2
    year: 2025
    tags: [Distillation, Post-training, KL Divergence]
    summary: 在教师与学生生成的数据上分别使用不同的蒸馏方向。
    summary_en: Use distinct distillation directions on teacher- and student-generated responses.
    scope: 教师轨迹的 skew KL 与学生轨迹的 skew reverse KL。
    scope_en: Skew KL on teacher trajectories and skew reverse KL on student trajectories.
    module_ids:
    - finetuning/distillm2
  - id: pkpo
    number: 34
    category: reinforcement-learning
    short_title: PKPO
    year: 2025
    tags: [Reinforcement Learning, Policy Gradient, Pass@K]
    summary: 将 pass@k 目标的奖励变换用于策略梯度训练。
    summary_en: Transform rewards to optimize a pass@k policy-gradient objective.
    scope: 连续奖励变换、policy loss 与论文的一维 Gaussian toy。
    scope_en: Continuous-reward transformation, policy loss, and the paper’s one-dimensional Gaussian toy.
    module_ids:
    - rl/pkpo
  - id: svdquant
    number: 35
    category: post-training
    short_title: SVDQuant
    year: 2025
    tags: [Quantization, Low-rank Approximation, Diffusion]
    summary: 用高精度低秩支路吸收量化困难成分，再量化残差。
    summary_en: Absorb difficult-to-quantize components in a high-precision low-rank branch and quantize the residual.
    scope: 平滑、SVD 低秩分解与 4-bit 残差前向。
    scope_en: Smoothing, SVD low-rank decomposition, and a 4-bit residual forward pass.
    module_ids:
    - finetuning/svdquant
  - id: moge
    number: 36
    category: representation
    short_title: MoGe
    year: 2025
    tags: [3D Geometry, Robust Estimation, Piecewise Linear Optimization]
    summary: 通过鲁棒几何对齐处理单目预测中的尺度与深度偏移。
    summary_en: Use robust geometric alignment to handle scale and depth-shift ambiguity in monocular predictions.
    scope: 截断加权 L1 的鲁棒最优估计。
    scope_en: Robust optimal estimation with truncated weighted L1 residuals.
    module_ids:
    - representation/moge_alignment
  - id: daps
    number: 37
    category: generative-models
    short_title: DAPS
    year: 2025
    tags: [Inverse Problems, Posterior Sampling, Langevin Dynamics]
    summary: 将干净空间的测量一致性优化与重新加噪解耦。
    summary_en: Decouple measurement-consistency updates in clean space from renoising.
    scope: 线性 Gaussian 后验 score、Langevin 与独立重新加噪。
    scope_en: Linear-Gaussian posterior score, Langevin updates, and independent renoising.
    module_ids:
    - diffusion/daps
  - id: diffusion-nft
    number: 38
    category: diffusion-rl
    short_title: DiffusionNFT
    year: 2026
    tags: [Diffusion RL, Flow Matching, Negative-aware Finetuning]
    summary: 从反馈构造正负隐式速度场，优化扩散模型。
    summary_en: Construct positive and negative implicit velocity fields from feedback to optimize diffusion models.
    scope: 正负 beta 隐式速度、双分支目标与微型训练。
    scope_en: Positive/negative beta implicit velocities, the two-branch objective, and tiny training.
    module_ids:
    - diffusion/diffusion_nft
  - id: var
    number: 39
    category: generative-models
    short_title: VAR
    year: 2024
