[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperleet"
version = "0.1.0"
description = "PaperLeet: coding practice for AI researchers."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pytest>=8", "pytest-timeout>=2.3", "PyYAML>=6"]

[project.scripts]
paperleet = "paperleet.cli:main"
leetpaper = "paperleet.cli:main"

[tool.setuptools]
# The standalone distribution owns stridetorch. Bundle the same source under
# a private name so installing/uninstalling either wheel cannot remove the other.
packages = ["paperleet", "paperleet.browser", "paperleet.common", "paperleet.judge", "paperleet.submissions", "paperleet._vendor", "paperleet._vendor.torch"]

[tool.setuptools.package-dir]
"paperleet._vendor.torch" = "packages/stridetorch/src/stridetorch"

[tool.setuptools.package-data]
paperleet = ["interview_catalog.json"]
"paperleet._vendor.torch" = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests", "problems"]
addopts = "--import-mode=importlib"
markers = ["t0: interface contracts", "t1: reference agreement", "t2: mathematical properties", "t3: behavioral experiments"]
