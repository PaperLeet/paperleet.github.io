name: PaperLeet quality gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Test judge infrastructure
        run: python -m pytest tests -q
      - name: Reference, mutation, determinism, and CPU budgets
        # The 60-module catalog takes ~330s on hosted runners. Keep the three
        # repetitions and per-module T3 limits; allow headroom for runner variance.
        run: paperleet ci --budget 600
      - name: Generate all visualization data and catalog
        run: paperleet vizdata all
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build static web app
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-reports
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: paperleet-web
          path: web/dist/
