name: PaperLeet quality gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e ./packages/paperleet-torch
      - name: Test judge infrastructure
        run: python -m pytest tests packages/paperleet-torch/tests -q
      - name: Reference, mutation, determinism, and CPU budgets
        # Keep three repetitions and every per-module T3 limit. The aggregate
        # deadline leaves headroom for the growing catalog and runner variance.
        run: paperleet ci --budget 600
      - name: Generate all visualization data and catalog
        run: paperleet vizdata all
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build static web app
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-reports
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: paperleet-web
          path: web/dist/
  browser-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the public catalog exporter
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e ./packages/paperleet-torch
      - name: Export the current source into immutable browser bundles
        run: python -m paperleet.cli export
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Execute every maintained suite and mutant on pinned WASM
        working-directory: web
        run: |
          npm ci
          npm run check:browser-wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-wasm-reports
          path: reports/browser-wasm.json
          if-no-files-found: warn
  pilot:
    needs: [native, browser-wasm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both native/frontend and complete WASM checks
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          WASM_RESULT: ${{ needs['browser-wasm'].result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$WASM_RESULT" = success
