name: PaperLeet quality gate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify explicit current-main release request
        run: node web/scripts/check-release-request.cjs
      - name: Validate Pages release gating
        run: node web/scripts/check-pages-release.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e ./packages/stridetorch
      - name: Reference, mutation, determinism, and CPU budgets
        # Keep three repetitions and every per-module T3 limit. The aggregate
        # deadline leaves headroom for the growing catalog and runner variance.
        run: paperleet ci --budget 600
      - name: Generate all visualization data and catalog
        run: paperleet vizdata all
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build static web app
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Build production Pages edition
        working-directory: web
        env:
          VITE_PATH_ROUTING: '1'
          PAPERLEET_MAIN_SITE_ENABLED: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED }}
          VITE_PUBLIC_SITE: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED == '1' && '0' || '1' }}
          VITE_APP_EDITION: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED == '1' && 'hosted' || 'local' }}
          VITE_API_ORIGIN: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED == '1' && 'https://app.paperleet.com' || '' }}
          VITE_HOSTED_APP_AVAILABLE: '1'
          VITE_HOSTED_APP_URL: https://app.paperleet.com
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-reports
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: paperleet-web
          path: web/dist/
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify explicit current-main release request
        run: node web/scripts/check-release-request.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e ./packages/stridetorch
      - name: Test judge infrastructure
        run: python -m pytest tests packages/stridetorch/tests -q
  browser-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PAPERLEET_WASM_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify explicit current-main release request
        run: node web/scripts/check-release-request.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the public catalog exporter
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -e ./packages/stridetorch
      - name: Export the current source into immutable browser bundles
        run: python -m paperleet.cli export
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Execute every maintained suite and mutant on pinned WASM
        working-directory: web
        run: |
          npm ci
          npm run check:browser-wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-wasm-reports
          path: reports/browser-wasm.json
          if-no-files-found: warn
  pilot:
    needs: [native, infrastructure, browser-wasm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require infrastructure, native/frontend and complete WASM checks
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          WASM_RESULT: ${{ needs['browser-wasm'].result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$INFRASTRUCTURE_RESULT" = success
          test "$WASM_RESULT" = success
