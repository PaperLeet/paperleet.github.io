name: Publish PaperLeet public site
on:
  workflow_run:
    workflows: [PaperLeet quality gate]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.repository == 'PaperLeet/paperleet.github.io' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      ((github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main') ||
      (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))) &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: paperleet-pages-build
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      quality_run: ${{ steps.release.outputs.quality_run }}
      publish: ${{ steps.release.outputs.publish }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require complete quality checks on this main revision
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const resolve = require('./web/scripts/pages-release-gate.cjs');
            const release = await resolve({github, context});
            core.setOutput('sha', release.sha);
            core.setOutput('quality_run', String(release.runId));
            core.setOutput('publish', String(release.publish !== false));
            if (release.publish === false) core.info('Already published this revision; skip duplicate build and deployment.');
            core.info(`Publishing tested main ${release.sha}, quality run ${release.runId}.`);
      - uses: actions/setup-python@v5
        if: steps.release.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Check static asset retention
        if: steps.release.outputs.publish == 'true'
        run: |
          python web/scripts/check-pages-assets.py
          node web/scripts/check-pages-backfill.cjs
          node web/scripts/check-native-pages-seed.cjs
      - name: Download the exact tested production build
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: paperleet-web
          run-id: ${{ steps.release.outputs.quality_run }}
          github-token: ${{ github.token }}
          path: web/dist
      - uses: actions/setup-node@v4
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Build public site
        if: steps.release.outputs.publish == 'true'
        working-directory: web
        env:
          PAPERLEET_MAIN_SITE_ENABLED: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED }}
          VITE_PATH_ROUTING: '1'
          VITE_PUBLIC_SITE: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED == '1' && '0' || '1' }}
          VITE_APP_EDITION: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED == '1' && 'hosted' || 'local' }}
          VITE_API_ORIGIN: ${{ vars.PAPERLEET_MAIN_SITE_ENABLED == '1' && 'https://app.paperleet.com' || '' }}
          VITE_HOSTED_APP_AVAILABLE: '1'
          VITE_HOSTED_APP_URL: https://app.paperleet.com
        run: |
          node scripts/pages-build-metadata.cjs verify dist "${{ steps.release.outputs.sha }}"
          if [ "$PAPERLEET_MAIN_SITE_ENABLED" = '1' ]; then
            echo paperleet.com > dist/CNAME
          fi
      - name: Find the previous successful Pages deployment
        if: steps.release.outputs.publish == 'true'
        id: previous-pages
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'pages.yml', branch: 'main',
              status: 'success', per_page: 100,
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100,
              });
              const available = artifacts.filter(artifact => !artifact.expired && Date.parse(artifact.expires_at) > Date.now());
              const artifact = available.find(item => item.name === 'paperleet-pages-assets')
                || available.find(item => item.name === 'github-pages');
              if (!artifact) continue;
              core.info(`Retaining assets from successful Pages run ${run.id} (${artifact.name}).`);
              core.setOutput('run_id', String(run.id));
              core.setOutput('artifact_name', artifact.name);
              return;
            }
            core.warning('No downloadable successful Pages artifact is available. The validated current build will be published without historical assets.');
      - name: Download previous static assets
        if: steps.release.outputs.publish == 'true' && (steps.previous-pages.outputs.run_id != '')
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous-pages.outputs.artifact_name }}
          run-id: ${{ steps.previous-pages.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/paperleet-previous-assets
      - name: Recover historical assets when extending the retention window
        if: steps.release.outputs.publish == 'true' && (steps.previous-pages.outputs.run_id != '')
        uses: actions/github-script@v7
        env:
          PREVIOUS_PAGES_RUN_ID: ${{ steps.previous-pages.outputs.run_id }}
        with:
          script: |
            const path = require('node:path');
            const backfill = require('./web/scripts/backfill-pages-assets.cjs');
            await backfill({github, context, core,
              previousRun: process.env.PREVIOUS_PAGES_RUN_ID,
              previousArchive: path.join(process.env.RUNNER_TEMP, 'paperleet-previous-assets/artifact.tar'),
              directory: path.join(process.env.RUNNER_TEMP, 'paperleet-historical-assets'),
            });
      - name: Snapshot branch-published assets
        if: steps.release.outputs.publish == 'true'
        run: |
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads "$remote" refs/heads/gh-pages > /dev/null; then
            native="$RUNNER_TEMP/paperleet-native-pages"
            git clone --filter=blob:none --no-checkout --single-branch --depth=1 \
              --branch gh-pages "$remote" "$native"
            git -C "$native" sparse-checkout set --no-cone /assets/ /pages-assets-manifest.json
            git -C "$native" checkout --force gh-pages
            paths=(assets)
            if git -C "$native" cat-file -e HEAD:pages-assets-manifest.json; then
              paths+=(pages-assets-manifest.json)
            fi
            git -C "$native" archive --format=tar HEAD "${paths[@]}" \
              > "$RUNNER_TEMP/paperleet-native-assets.tar"
          else
            snapshot_status=$?
            if [[ "$snapshot_status" != 2 ]]; then exit "$snapshot_status"; fi
          fi
      - name: Retain assets for cached pages
        if: steps.release.outputs.publish == 'true'
        env:
          PREVIOUS_PAGES_RUN_ID: ${{ steps.previous-pages.outputs.run_id }}
        run: |
          previous=()
          if [[ -n "$PREVIOUS_PAGES_RUN_ID" ]]; then
            previous=(--previous "$RUNNER_TEMP/paperleet-previous-assets/artifact.tar")
          fi
          shopt -s nullglob
          for archive in "$RUNNER_TEMP"/paperleet-historical-assets/*/artifact.tar; do
            previous+=(--seed "$archive")
          done
          if [[ -f "$RUNNER_TEMP/paperleet-native-assets.tar" ]]; then
            previous+=(--seed "$RUNNER_TEMP/paperleet-native-assets.tar")
          fi
          mkdir -p "$RUNNER_TEMP/paperleet-retained-assets"
          python web/scripts/retain-pages-assets.py web/dist "${previous[@]}" \
            --archive-out "$RUNNER_TEMP/paperleet-retained-assets/artifact.tar"
      - name: Save lightweight assets for the next deployment
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paperleet-pages-assets
          path: ${{ runner.temp }}/paperleet-retained-assets/artifact.tar
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.publish == 'true'
        with:
          path: web/dist
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: paperleet-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Recheck the tested revision before publishing
        id: current
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          QUALITY_RUN: ${{ needs.build.outputs.quality_run }}
        with:
          script: |
            const resolve = require('./web/scripts/pages-release-gate.cjs');
            const release = await resolve({github, context});
            const publish = release.sha === process.env.RELEASE_SHA && release.runId === Number(process.env.QUALITY_RUN) && release.publish !== false;
            core.setOutput('publish', String(publish));
            core.info(publish ? 'The tested explicit release is still current.' : 'Skip duplicate publication.');
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.publish == 'true'
        id: deployment
