type: implement
parent: null
difficulty: E
functions:
- name: clip_gradients
  signature: 'clip_gradients(gradients: list[Tensor], max_norm: float, eps: float = 1e-6) -> tuple[list[Tensor],
    Tensor]'
module:
  goal: 计算跨参数的全局范数，并用统一比例裁剪。
  goal_en: Compute one gradient norm across all parameters and apply a shared clipping scale.
  scope: 只实现一个核心函数；提供独立测试和确定性合成实验。
  scope_en: Implement one core function; independent tests and deterministic synthetic experiments
    are provided.
  required_functions:
  - clip_gradients
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: float32/float64; int64 IDs and bool masks where specified
  device: CPU
  contract: 'Nonempty list of finite float32/64 CPU gradient tensors, same dtype/device but arbitrary
    shapes, including scalars/empty tensors. Finite max_norm>=0 and eps>0. Compute the global L2
    norm over every element of every tensor. Return (new gradient list, original scalar total_norm),
    same shapes/dtype/device, using scale=min(1,max_norm/(total_norm+eps)) for every tensor. Empty/all-zero
    gradients have norm zero; max_norm=0 yields zeros. Pure function: no .grad mutation, optimizer
    update or input/list mutation. No higher-order-gradient requirement. The denominator epsilon
    is explicit and matches the exercise clipping convention; this is norm clipping, not elementwise
    value clipping.'
