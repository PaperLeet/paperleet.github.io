parent: null
difficulty: M
functions:
- name: top_p_probs
  signature: 'top_p_probs(logits: Tensor, p: float, temperature: float = 1.) -> Tensor'
module:
  goal: 正确保留累计概率阈值边界，并恢复词表顺序。
  goal_en: Keep the smallest candidate set that reaches the probability threshold, then restore vocabulary order.
  scope: 只实现一个核心函数；提供独立测试和确定性合成实验。
  scope_en: Implement one core function; independent tests and deterministic synthetic experiments
    are provided.
  required_functions:
  - top_p_probs
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: float32/float64; int64 IDs and bool masks where specified
  device: CPU
  contract: Finite float32/64 logits [...,V], V>=1, CPU; empty leading dimensions allowed. Finite
    0<p<=1 and temperature>0. Form full-vocabulary softmax(logits/temperature), sort descending with
    smaller vocabulary index first on ties, and retain the shortest nonempty prefix whose cumulative
    mass is >=p. Include the token that first reaches/crosses p. At p=1 keep all tokens. Renormalize
    retained probabilities and return original vocabulary order with zeros elsewhere, same shape/dtype/device.
    No random sampling, input mutation or derivative requirement. Compute scaling, probabilities and cumulative boundary comparisons in float64, without arbitrary
    tolerances; cast only the final result to the input dtype.
