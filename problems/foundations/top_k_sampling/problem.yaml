mutants:
- id: m1_smallest
  bug: 保留最小的 k 个 logit。
- id: m2_wrong_temperature
  bug: 将温度乘到 logits 上。
- id: m3_too_many
  bug: 多保留一个候选。
- id: m4_threshold_ties
  bug: 阈值过滤保留过多并列项。
