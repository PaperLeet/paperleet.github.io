type: implement
parent: null
difficulty: E
functions:
- name: top_k_probs
  signature: 'top_k_probs(logits: Tensor, k: int, temperature: float = 1.) -> Tensor'
module:
  goal: 将温度缩放与精确 Top-k 候选过滤组成确定性概率变换。
  goal_en: 'Top-k: Temperature and Candidate Probabilities'
  scope: 只实现一个核心函数；提供独立测试和确定性合成实验。
  scope_en: Implement one core function; independent tests and deterministic synthetic experiments
    are provided.
  required_functions:
  - top_k_probs
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: float32/float64; int64 IDs and bool masks where specified
  device: CPU
  contract: 'Finite float32/64 logits [...,V], V>=1, CPU; zero-length leading dimensions allowed.
    Integer 1<=k<=V; finite temperature>0. Select exactly k largest logits per last-axis row, breaking
    ties by smaller vocabulary index. Return same-shaped/dtype/device probabilities: softmax(logits/temperature)
    restricted to selected indices, exactly zero elsewhere, row sums one. Selection is independent
    for each row. No random draw or input mutation; derivatives are not required. Exact-k tie handling
    is an explicit exercise convention, unlike threshold-based implementations that may retain extra
    ties. Use float64 intermediate scaling and cast only the final probabilities to the input dtype.'
estimated_minutes: 15
