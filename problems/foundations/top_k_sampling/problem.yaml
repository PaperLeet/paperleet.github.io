id: foundations/top_k_sampling
number: 88
title: Top-k：温度缩放与候选概率
title_en: 'Top-k: Temperature and Candidate Probabilities'
paper_id: llm-training-generation
paper:
  title: 'LLM Training and Generation: Small Implementation Exercises'
  authors: PaperLeet original curriculum; primary documentation linked per exercise
  url: https://huggingface.co/learn/llm-course/chapter1/1
  anchors:
