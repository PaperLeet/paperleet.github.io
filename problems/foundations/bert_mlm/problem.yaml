- id: m3_mask_boundary
  bug: Put exactly .8 in the MASK branch
- id: m4_all_position_mean
  bug: Dilute the loss by total sequence positions
- id: m5_detached_logits
  bug: Detach logit gradients before log-softmax
- id: m6_next_token_shift
  bug: Apply an autoregressive target shift to MLM
- id: m7_random_boundary
  bug: Put exactly .9 in the random branch
