module:
  goal: 实现选中词的 80/10/10 替换、原词标签，以及只对选中位置求均值的稳定交叉熵。
  goal_en: Implement 80/10/10 selected-token corruption, original-token labels and stable cross entropy averaged
    only over selected positions.
  scope: 补全数据替换与 MLM 损失；提供双向上下文表的合成训练，不包含 Transformer、NSP、分词或语言基准复现。
  scope_en: Complete corruption and the MLM loss; a supplied bidirectional context table trains on synthetic triples.
    Transformer, NSP, tokenization and language benchmarks are outside scope.
  required_functions:
  - make_mlm_inputs
  - masked_lm_loss
  provided_functions: []
  optional: false
