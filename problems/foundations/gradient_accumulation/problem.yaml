functions:
- name: accumulate_gradients
  signature: 'accumulate_gradients(gradients: list[Tensor], token_counts: list[int]) -> Tensor'
module:
  goal: 让不等长 microbatch 的平均梯度等价于一个有效 token 大 batch。
  goal_en: 'Gradient Accumulation: Valid-token Weighting'
  scope: 只实现一个核心函数；提供独立测试和确定性合成实验。
  scope_en: Implement one core function; independent tests and deterministic synthetic experiments
    are provided.
  required_functions:
  - accumulate_gradients
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: float32/float64; int64 IDs and bool masks where specified
  device: CPU
  contract: Nonempty equal-length lists. Each gradient is a finite float32/64 CPU tensor for the
    same parameter, with identical shape/dtype/device, possibly scalar or empty. Each token_count
    is a nonnegative integer and their total is >0. Input gradient i already represents the mean
    over its valid tokens. Return sum(count_i * gradient_i)/sum(count_i), ignoring zero-count batches,
    same shape/dtype/device. Do not average microbatches equally, divide by the number of accumulation
    steps, perform optimizer updates, mutate inputs or retain state. Higher-order gradients are not
    required. Gradients from different parameters are not being merged.
