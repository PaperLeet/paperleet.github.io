functions:
- name: next_token_loss
  signature: 'next_token_loss(logits: Tensor, tokens: Tensor) -> Tensor'
module:
  goal: 对齐自回归预测与下一位置标签，计算稳定平均损失。
  goal_en: Align predictions with the next token and compute a stable average loss.
  scope: 只实现一个核心函数；提供独立测试和确定性合成实验。
  scope_en: Implement one core function; independent tests and deterministic synthetic experiments
    are provided.
  required_functions:
  - next_token_loss
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: float32/float64; int64 IDs and bool masks where specified
  device: CPU
  contract: Finite float32/64 logits [B,T,V], B,T,V>=1; int64 tokens [B,T] in [0,V), same CPU device.
    Logits at t predict tokens at t+1. Return scalar NLL averaged over B*(T-1) targets, preserving
    logits dtype/device and gradients. Ignore the last logit and first target; never cross sequence
    boundaries. T=1 returns a differentiable zero with zero logits gradients. No padding, masks,
    smoothing or mutation.
