id: foundations/multiturn_sft_mask
number: 94
title: 多轮 SFT：回答标签与会话边界
title_en: 'Multi-turn SFT: Assistant Targets and Conversation Boundaries'
paper_id: llm-training-generation
paper:
  title: 'LLM Training and Generation: Small Implementation Exercises'
  authors: PaperLeet original curriculum; primary documentation linked per exercise
  url: https://huggingface.co/learn/llm-course/chapter1/1
  anchors:
  - https://huggingface.co/docs/trl/sft_trainer#train-on-assistant-messages-only
  - https://huggingface.co/docs/trl/sft_trainer#label-shifting-and-masking
