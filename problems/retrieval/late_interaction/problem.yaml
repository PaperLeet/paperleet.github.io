id: retrieval/late_interaction
number: 66
title: ColBERT：逐 token MaxSim 与成对排序
title_en: 'ColBERT: Token-Level MaxSim and Pairwise Ranking'
paper:
  title: 'ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction
    over BERT'
  authors: Omar Khattab and Matei Zaharia
  venue: SIGIR 2020
  arxiv: '2004.12832'
  anchors:
  - 'Section 3.2: normalized token encodings and query augmentation'
  - 'Section 3.3, equation 3: MaxSim and pairwise softmax training'
paper_id: colbert
type: implement
parent: null
difficulty: M
functions:
- name: maxsim_scores
  signature: 'maxsim_scores(query: Tensor, documents: Tensor, query_mask=None, document_mask=None)
    -> Tensor'
- name: pairwise_loss
  signature: 'pairwise_loss(positive: Tensor, negative: Tensor) -> Tensor'
- name: _checked_masks
  signature: _checked_masks(query, documents, query_mask, document_mask) -> tuple[Tensor, Tensor]
- name: _check_pairs
  signature: _check_pairs(positive, negative) -> None
module:
  goal: 保留逐 token 匹配证据，并用稳定的成对损失优化正负文档排序。
  goal_en: Preserve per-token matching evidence and optimize positive/negative document ranking
    with a stable pairwise loss.
  scope: 供给投影后的 token 向量，实现余弦 MaxSim 与成对 softmax 损失；不训练 BERT、分词器或 ANN 索引。
  scope_en: Supplied projected token vectors, cosine MaxSim and pairwise softmax; no BERT encoder,
    tokenizer or ANN index training.
  required_functions:
  - maxsim_scores
  - pairwise_loss
  provided_functions:
  - _checked_masks
  - _check_pairs
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; Boolean token masks; float64 teaching training.
  device: CPU; no model download, API, dataset or GPU.
  contract: Mask True keeps an encoded position. Query augmentation is not discarded. See bilingual
    statements for empty-document and tie-gradient conventions.
tests:
  T0: 1
  T1: 1
  T2: 7
  T3: 1
t3_budget_s: 10
estimated_minutes: 30
tags:
- ColBERT
- Late Interaction
- MaxSim
- Dense Retrieval
- Pairwise Ranking
viz:
- toy_experiment
sources_verified: '2026-10-14'
verified_sources:
  checked_at: '2026-10-14'
  links:
  - https://arxiv.org/abs/2004.12832
  - https://people.eecs.berkeley.edu/~matei/papers/2020/sigir_colbert.pdf
toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2004.12832
  anchor: Sections 3.2 and 3.3, equations 1–3
  adaptation: Four synthetic queries, eight fixed token-vector documents and 120 Adam updates
    to query vectors; no BERT training, ANN index or paper retrieval benchmark.
