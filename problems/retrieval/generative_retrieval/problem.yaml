id: retrieval/generative_retrieval
number: 65
title: TIGER：生成 ID 与合法物品召回
title_en: 'TIGER: Generate IDs and Retrieve Valid Items'
paper:
  title: Recommender Systems with Generative Retrieval
  authors: Shashank Rajput et al.
  venue: NeurIPS 2023
  arxiv: '2305.05065'
  anchors:
  - 'Section 3.1: residual quantization'
  - 'Section 4: unique fourth codeword'
  - 'Sections 3.2 and 4.5: beam decoding and invalid ID filtering'
paper_id: tiger
type: implement
parent: null
difficulty: M
functions:
- name: beam_search
  signature: 'beam_search(next_logits: Callable, length: int, beam_width: int) ->
    list'
- name: lookup_candidates
  signature: 'lookup_candidates(beams: list, catalog_ids: Tensor, k: int) -> list'
module:
  goal: 累计条件 log 概率生成完整 ID，再过滤无效和重复物品。
  goal_en: Generate complete IDs with cumulative conditional log-probabilities, then
    filter invalid and duplicate items.
  scope: 实现无约束完整 ID 的 beam 解码，再查表过滤合法物品；不训练序列模型或使用前缀匹配。
  scope_en: 'Sections 3.2 and 4.5: unconstrained full-ID beam decoding followed by
    exact catalog filtering; fixed logits, no seq2seq training or prefix matching.'
  required_functions:
  - beam_search
  - lookup_candidates
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/64 for quantization; float64 logits, int64 IDs.
  device: CPU; no weights, datasets, network or GPU required
  contract: See starter docstrings and bilingual statements; tie and suffix order
    are explicit teaching conventions.
tests:
  T0: 1
  T1: 1
  T2: 5
  T3: 1
t3_budget_s: 10
estimated_minutes: 30
