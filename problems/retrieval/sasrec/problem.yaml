toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/1808.09781v1
  anchor: Sections III-B and III-E
  adaptation: Two history-dependent training histories plus an empty row, 72 trainable query/readout parameters and 160 Adam updates. Fixed item vectors, identity K/V and small positional offsets; no FFN/dropout or public recommendation benchmark. Negatives rotate through non-target items and may occur in history.
