id: retrieval/lightgcn
number: 69
title: LightGCN：归一化二部图与多层协同传播
title_en: 'LightGCN: Normalized Bipartite Graphs and Collaborative Propagation'
paper_id: lightgcn
paper:
  title: 'LightGCN: Simplifying and Powering Graph Convolution Network for Recommendation'
  authors: Xiangnan He, Kuan Deng, Xiang Wang, Yan Li, Yongdong Zhang and Meng Wang
  venue: SIGIR 2020
  arxiv: '2002.02126'
  url: https://arxiv.org/abs/2002.02126
  anchors:
  - 'Sections 3.1.1–3.1.3, Equations 3–8: symmetric graph propagation and layer aggregation'
  - 'Section 3.2.3, Equations 13–14: second-order collaborative influence'
  - 'Section 3.3, Equation 15: BPR objective and initial-embedding regularization'
type: implement
parent: null
difficulty: M
functions:
- name: normalized_bipartite_graph
  signature: 'normalized_bipartite_graph(interactions: Tensor, dtype=None) -> Tensor'
- name: lightgcn_embeddings
  signature: 'lightgcn_embeddings(initial: Tensor, normalized_graph: Tensor, layers: int=2) -> Tensor'
- name: _check_graph
  signature: _check_graph(interactions, dtype) -> None
- name: _check_propagation
  signature: _check_propagation(initial, normalized_graph, layers) -> None
module:
  goal: 用用户—物品图传播协同信号，并保留包含初始层的可微聚合。
  goal_en: Propagate collaborative signals through a user-item graph and differentiate the aggregation including the initial layer.
  scope: 稠密二部图的对称归一化、线性多跳传播与均匀层平均；BPR 目标和小型训练循环已提供。
  scope_en: Symmetric normalization of a dense bipartite graph, linear multi-hop propagation and uniform layer averaging; BPR loss and tiny training loop are provided.
  required_functions: [normalized_bipartite_graph, lightgcn_embeddings]
  provided_functions: [_check_graph, _check_propagation]
  optional: false
conventions:
  seed: 42
  dtype: Boolean histories; float32/float64 graph and embeddings.
  device: CPU; no GPU, account, external dataset or pretrained model.
  contract: Zero-based IDs with users before items and no padding. No self loops. Zero-degree graph rows remain zero. Average layers 0 through K with weight 1/(K+1). Preserve gradients through both tensor inputs to propagation; the supplied training loop learns only E0.
tests: {T0: 2, T1: 1, T2: 6, T3: 1}
t3_budget_s: 10
estimated_minutes: 30
tags: [LightGCN, Graph Collaborative Filtering, Bipartite Graph, Neighbor Aggregation, BPR]
viz: [toy_experiment]
browser: {backend: numpy-autograd-wasm}
sources_verified: '2026-10-15'
verified_sources:
  checked_at: '2026-10-15'
  links:
  - https://arxiv.org/abs/2002.02126
  - https://arxiv.org/pdf/2002.02126
  - https://github.com/kuandeng/LightGCN
toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2002.02126
  anchor: Sections 3.1.1–3.1.3, Equations 3–8; Section 3.3, Equation 15
  adaptation: A dense graph with 4 synthetic users, 6 items, 24 observed/unobserved triples, 30 learned initial-embedding entries and 160 full-batch Adam updates. Uniform layers 0–2 and one global E0 prior. Not sparse large-graph training, a real recommendation dataset or held-out paper metrics.
mutants:
- id: m1_unnormalized_graph
  bug: Propagate through raw edges without endpoint-degree normalization.
- id: m2_random_walk_normalization
  bug: Divide only by the receiving node degree instead of symmetric endpoint degrees.
- id: m3_self_loops
  bug: Add self loops before computing degrees.
- id: m4_final_layer_only
  bug: Return only the final propagated state instead of aggregating every layer.
- id: m5_omit_initial_layer
  bug: Omit the initial embeddings from the layer sum.
- id: m6_detached_layers
  bug: Detach each propagated layer and cut its gradient paths.
- id: m7_nonlinear_propagation
  bug: Apply ReLU after each linear graph step.
- id: m8_missing_reverse_edges
  bug: Keep user-to-item edges but drop item-to-user edges.
