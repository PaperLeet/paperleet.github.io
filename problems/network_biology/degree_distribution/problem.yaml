functions:
- name: node_degrees
  signature: 'node_degrees(nodes: list[str], edges: list[tuple[str, str]]) -> dict[str, int]'
- name: degree_distribution
  signature: 'degree_distribution(nodes: list[str], edges: list[tuple[str, str]]) -> dict[int, float]'
module:
  goal: 把互作网络表示为节点与边，计算每个节点的度，并区分“单个节点的度”与“整个网络的度分布”。
  goal_en: Represent an interaction network as nodes and edges, compute each node's degree, and distinguish a node's degree from the network's degree distribution.
  scope: 实现简单无向图的节点度与稠密度分布；重复边、自环、孤立节点和非法输入都有明确约定。
  scope_en: Implement node degrees and a dense degree distribution for a simple undirected graph, with explicit rules for duplicate edges, self-loops, isolated nodes and invalid input.
  required_functions:
  - node_degrees
  - degree_distribution
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: Python str node names, int degrees, float probabilities
  device: CPU; pure Python standard library, no network access or dataset download
  contract: 'Simple undirected graph. nodes is a list of unique str names; edges is a list of (u, v) pairs, unordered. Duplicate names or an endpoint outside nodes raise ValueError. Self-loops are ignored and each unordered pair counts once, so reversed or repeated edges never inflate a degree. Isolated nodes appear with degree 0. degree_distribution returns P(k)=n_k/N for every integer k=0..max degree in ascending order (absent degrees map to 0.0) and {} when there are no nodes.'
