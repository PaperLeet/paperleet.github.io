  anchor: Node degree and degree distribution as graph descriptors of cellular networks
  adaptation: Synthetic 8-node toy interaction network and a deterministic 60-node preferential-attachment toy graph; no real interactome, no power-law fit, and no claim that any biological network is scale-free.
mutants:
