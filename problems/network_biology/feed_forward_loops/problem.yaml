toy:
  kind: teaching_adaptation
  source: https://doi.org/10.1126/science.1078368
  anchor: Motifs as patterns occurring more often than in randomized networks
  adaptation: Synthetic 12-node regulatory network with three loops and a deterministic degree-preserving edge-swap comparison; counts only, with no significance test, no real regulatory data and no claim about function.
mutants:
- id: m1_undirected_triangles
  bug: 把边当作无向边，三角形的任意方向都算前馈环。
- id: m2_missing_shortcut_edge
  bug: 不要求 x 直接调控 z，只检查 x->y->z 链。
- id: m3_ignore_induced
  bug: induced=True 时没有排除额外的反向边。
- id: m4_self_loops_kept
  bug: 自环被当作普通调控边保留，使三个节点不再互异。
- id: m5_unsorted_output
  bug: 返回的三元组没有排序。
- id: m6_partial_induced_check
  bug: induced 模式只排除 y->x，漏掉 z->x 和 z->y。

