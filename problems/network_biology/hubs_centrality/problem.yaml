  source: https://doi.org/10.1038/nrg1272
  anchor: Network measures as descriptors of cellular networks
  adaptation: Synthetic 9-node two-module graph joined through one connector node; centralities are computed on the toy graph only, with no interactome data and no claim about essentiality.
mutants:
- id: m1_degree_denominator
  bug: 度中心性分母用 N 而不是 N-1。
- id: m2_betweenness_scale
  bug: 介数归一化少了因子 2，等于把无序点对当作有序点对。
- id: m3_tie_order_reversed
  bug: 并列时按节点名降序排列。
- id: m4_no_rounding
  bug: 比较分数时不做舍入，浮点误差会打破本应相等的并列。
- id: m5_endpoints_counted
  bug: 把路径两端点也计入介数。
- id: m6_ignore_path_counts
  bug: 只要在某条最短路径上就计 1，忽略最短路径条数。

