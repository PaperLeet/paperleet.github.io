id: architecture/batch_norm
number: 95
title: BatchNorm：批统计量、移动估计与推理
title_en: 'BatchNorm: Batch Moments, Moving Estimates and Inference'
paper_id: batchnorm
paper:
  title: 'Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift'
  authors: Sergey Ioffe, Christian Szegedy
  venue: ICML 2015
  arxiv: '1502.03167'
  anchors:
  - 'Section 3, Algorithm 1: differentiable minibatch population moments'
  - 'Section 3.1, Algorithm 2: unbiased population variance estimates and frozen inference'
