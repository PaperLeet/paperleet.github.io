type: implement
parent: null
difficulty: M
functions:
- name: batch_norm
  signature: 'batch_norm(x: Tensor, weight: Tensor, bias: Tensor, running_mean: Tensor, running_var: Tensor, training:
    bool = True, momentum: float = 0.1, eps: float = 1e-5) -> tuple[Tensor, Tensor, Tensor]'
module:
  goal: 区分训练归一化的总体方差与移动估计使用的无偏方差，并实现冻结统计量的推理。
  goal_en: Distinguish population variance for training normalization from unbiased running estimates, then implement
    frozen-statistics inference.
  scope: 补全一个纯函数，返回输出和下一组统计量；提供仿射参数训练与推理独立性实验，不复现 ImageNet 结果。
  scope_en: Complete a pure function returning output and next statistics; affine training and inference-independence
    experiments are supplied, without reproducing ImageNet results.
  required_functions:
  - batch_norm
  provided_functions: []
  optional: false
conventions:
  layout: x [N,C,*spatial], rank >= 2; C and spatial dimensions positive; affine parameters/buffers [C]
  reduction: Reduce (0,2,3,...), independently for each channel; m = N * product(spatial)
  training: m >= 2; normalize using population variance (denominator m); preserve gradients through both batch moments
  running: next = (1-momentum)*old + momentum*batch; variance update uses m/(m-1); returned estimates and inference
    buffers are detached
  inference: Use supplied running moments; do not recompute them or change buffers; empty batches allowed
  purity: Return (y,next_mean,next_var), never update an input in place; all tensors have matching float32/float64
    dtype/device
  parameters: Finite eps > 0 inside sqrt; finite momentum in [0,1]; training is bool; well-scaled finite inputs
tests:
  T0: 1
  T1: 1
  T2: 8
  T3: 1
