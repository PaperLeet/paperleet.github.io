difficulty: E
functions:
- name: softcap
  signature: 'softcap(x: Tensor, beta: float) -> Tensor'
- name: situ_glu
  signature: 'situ_glu(gate: Tensor, up: Tensor, beta1: float = 4.0, beta2: float = 25.0) -> Tensor'
module:
  goal: 平滑限制门控与 up 分支，在保留局部 SwiGLU 行为的同时控制异常激活。
  goal_en: Smoothly cap both activation branches while retaining local SwiGLU behavior.
  scope: 只实现 softcap 和已投影张量上的 SiTU-GLU；不实现 MoE 路由或完整 FFN。
  scope_en: Implement softcap and SiTU-GLU on projected tensors; MoE routing and the full FFN are outside this module.
  required_functions:
  - softcap
  - situ_glu
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: Preserve input dtype/device and autograd; float32 and float64 CPU inputs.
  device: CPU; no pretrained weights or downloads
  branches: Same-shaped finite floating tensors; no input mutation; arbitrary leading dimensions including empty tensors.
  caps: Finite positive Python scalars; invalid caps raise ValueError (validation supplied in starter).
tests:
  T0: 2
  T1: 2
  T2: 4
  T3: 1
