id: architecture/situ_glu
number: 35
title: SiTU-GLU 平滑有界激活
title_en: SiTU-GLU Smooth Bounded Activation
paper:
  title: 'Kimi K3: Open Frontier Intelligence'
  authors: Kimi Team
  venue: arXiv 2026
  arxiv: '2607.24653'
  url: https://arxiv.org/abs/2607.24653v2
  anchors:
  - 'Section 2.3.2, Eq. (12): independently capped gate and up branches'
