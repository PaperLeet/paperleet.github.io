    Tensor) -> tuple[Tensor, Tensor, Tensor]'
- name: block_attention
  signature: 'block_attention(q: Tensor, k: Tensor, v: Tensor, block_size: int=16) -> tuple[Tensor, Tensor]'
module:
  goal: 用在线 softmax 合并 score 分块，得到精确 attention 和 log-sum-exp。
  goal_en: Merge score tiles with online softmax to recover exact attention and log-sum-exp.
  scope: 只实现 online_softmax_update；双向分块遍历与最终归一化已提供。CPU 教学实现不复现 GPU 加速。
  scope_en: Implement only online_softmax_update; query/key tiling and final normalization are supplied. This
    CPU teaching implementation does not reproduce GPU acceleration.
  required_functions:
  - online_softmax_update
  provided_functions:
  - block_attention
  optional: false
