toy:
  kind: teaching_adaptation
  source: https://arxiv.org/html/2410.05258v1
  anchor: Section 2.1, Eqs. (1)–(2)
  adaptation: A four-token lambda sweep measures cancellation of a shared value offset
    and the retained signal; not a language-model benchmark or universal denoising
    guarantee.
mutants:
- id: m1_add_attention_maps
  bug: Adds the second attention map instead of subtracting.
- id: m2_wrong_scale
  bug: Scales scores by D instead of sqrt(D).
- id: m3_unmasked_second_branch
  bug: Lets the second branch attend to future tokens.
- id: m4_lambda_sum
  bug: Adds exponentials in the lambda parameterization.

