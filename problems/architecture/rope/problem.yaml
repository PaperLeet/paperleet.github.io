toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2104.09864
  anchor: Sections 3.2 and 3.4.2, Equations (13)–(16) and (34)
  adaptation: Synthetic six-feature logits, a joint position shift and nine cached keys. Contrast correct absolute chunk offsets with resetting new-key positions. Not a paper benchmark, training task, speed measurement or proof of long-context generalization.
mutants:
- id: m1_reverse_rotation
  bug: 旋转角度取反
- id: m2_wrong_frequency
  bug: 指数除以特征对数量，频率变化过快
- id: m3_half_split
  bug: 把前后两半配对，不符合相邻维度约定
- id: m4_ignore_positions
  bug: 忽略传入位置，每次从零开始
- id: m5_detached_features
  bug: 旋转前 detach 输入，切断特征梯度
- id: m6_float32_phase
  bug: 强制 float32 相位，破坏 float64 精度
