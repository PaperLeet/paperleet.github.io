id: architecture/residual_block
number: 94
title: ResNet：残差分支与投影捷径
title_en: 'ResNet: Residual Branches and Projection Shortcuts'
paper_id: resnet
paper:
  title: Deep Residual Learning for Image Recognition
  authors: Kaiming He, Xiangyu Zhang, Shaoqing Ren, Jian Sun
  venue: CVPR 2016
  arxiv: '1512.03385'
  anchors:
  - 'Section 3.2, Equations (1) and (2), Figure 2: two-layer residual mapping and post-addition ReLU'
type: implement
parent: null
difficulty: M
functions:
- name: residual_block
  signature: 'residual_block(x: Tensor, w1: Tensor, w2: Tensor, projection: Tensor | None = None) -> Tensor'
module:
  goal: 实现两层残差分支、恒等或投影捷径，以及相加后的 ReLU。
  goal_en: Implement a two-layer residual branch, identity or projection shortcut, and post-addition ReLU.
  scope: 补全一个矩阵版本的残差块；提供四块网络的合成回归实验，不包含卷积、BN 或完整 ResNet 训练。
  scope_en: Complete one matrix residual block; a four-block synthetic regression experiment is supplied. Convolutions,
    BN and full ResNet training are outside scope.
  required_functions:
  - residual_block
  provided_functions: []
  optional: false
conventions:
  layout: x [B,D_in], w1 [D_in,H], w2 [H,D_out], projection [D_in,D_out]; positive feature widths, B >= 0
  weights: Weights are right-multiplied, unlike nn.Linear.weight storage; no biases or normalization
  activation: ReLU after the first matrix product and after the residual/shortcut sum; no ReLU on the second branch
    output before addition
  shortcut: None means identity and requires D_in == D_out; an explicit projection is always used, even if square
  gradients: Preserve gradients to x, w1, w2 and projection; no detach or in-place modification
  dtype: Matching float32/float64 dtype/device; CPU tests use finite, well-scaled inputs
tests:
  T0: 1
  T1: 1
  T2: 6
  T3: 1
