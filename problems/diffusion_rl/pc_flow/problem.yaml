module:
  goal: 从相邻时刻的分类器 logits 构造参考模型无关的偏好训练目标。
  goal_en: Build a reference-free preference objective from classifier logits at adjacent sampling times.
  scope: 只训练偏好分类器的相邻时刻目标；基座 flow 与引导采样器不在范围内。
  scope_en: Implement the adjacent-time classifier objective; the base flow and guided sampler are outside
    the exercise.
  required_functions:
  - pcflow_loss
  provided_functions: []
  optional: false
conventions:
  tensors: CPU float32/float64, preserve dtype/device; finite nonempty inputs. No in-place mutation.
  contract: winner_next/winner_now/loser_next/loser_now are equal (B,) classifier logits. beta>0, total_steps
    is positive integer. Classifier probabilities are sigmoid(logit), not raw logits.
  autograd: All four classifier evaluations differentiate because both adjacent states contribute to each
    log probability ratio.
