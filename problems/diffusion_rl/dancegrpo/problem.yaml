  source: https://arxiv.org/abs/2505.07818
  anchor: Section 2.2 Eqs. (9)-(10), Initialization Noise; Section 2.3 combined rewards
  adaptation: Two prompt groups share initial states but draw independent Gaussian actions. Two differently
    scaled quadratic reward channels train a scalar conditional policy for 70 updates.
