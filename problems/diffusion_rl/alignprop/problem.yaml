id: diffusion_rl/alignprop
number: 171
title: AlignProp 去噪链的截断奖励反传
title_en: AlignProp Truncated Reward Backpropagation
paper:
  title: Aligning Text-to-Image Diffusion Models with Reward Backpropagation
  authors: Mihir Prabhudesai et al.
  venue: 2023 preprint / linked proceedings
  url: https://arxiv.org/abs/2310.03739
  anchors:
  - 'Method: reward backpropagation; official sd_pipeline.py backprop_timestep'
  arxiv: '2310.03739'
paper_id: alignprop
difficulty: M
functions:
- name: reward_rollout
  signature: 'reward_rollout(initial: Tensor, alphas: Tensor, sigmas: Tensor, denoiser, backprop_from:
    int) -> Tensor'
type: implement
parent: null
module:
  goal: 实现一个可控制梯度起点的 DDIM 采样链，让终点奖励穿过指定的去噪后缀反传。
  goal_en: Implement a DDIM sampling chain whose terminal reward differentiates through a selected denoising
    suffix.
  scope: 调用传入的小型 epsilon 模型，练习时间方向和梯度截断；不实现 LoRA 或 checkpoint 内存优化。
  scope_en: Call a supplied small epsilon model to study time direction and gradient truncation; LoRA
    and activation checkpointing are outside scope.
  required_functions:
  - reward_rollout
  provided_functions: []
  optional: false
conventions:
  tensors: CPU float32/float64, preserve dtype/device; finite nonempty inputs. No in-place mutation.
  contract: initial (B,D); alphas/sigmas equal vectors of length T+1 in execution order noisy-to-clean,
    amplitudes alpha>0, sigma>=0. denoiser(x,step) returns same shape. backprop_from in [0,T-1] specifies
    first differentiable transition. Terminal schedule is caller-supplied.
  autograd: Initial noise and schedules are frozen. Prefix transitions execute without gradients; suffix
    transitions retain all recurrent state and model paths.
tests:
  T0: 1
  T1: 2
  T2: 3
  T3: 1
