  source: https://arxiv.org/abs/2606.11025
  anchor: 'Section 3.3 Eqs. (14), (17)-(18): Gaussian divergence and directional mask'
  adaptation: A scalar Gaussian policy draws 128 fresh actions per update and optimizes a quadratic reward
    with beta=0.1 reference KL for 65 iterations. Independent tests exercise nonzero old-policy divergence
