module:
  goal: 把终点偏好传到各去噪步骤，并在每一步计算参考策略校正的偏好损失。
  goal_en: Propagate terminal preferences to denoising transitions and compute reference-corrected preference
    losses per step.
  scope: 实现给定轨迹 log-prob 的逐步 D3PO 损失；不把多步概率先相乘。
  scope_en: Implement stepwise D3PO from trajectory log probabilities, without collapsing them into one
    trajectory-level likelihood.
