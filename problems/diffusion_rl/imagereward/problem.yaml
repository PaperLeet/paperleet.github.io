- name: refl_clean
  signature: 'refl_clean(latent: Tensor, epsilon: Tensor, alpha: float, sigma: float) -> Tensor'
type: implement
parent: null
module:
  goal: 实现偏好排序损失，以及冻结前缀后的单步干净样本预测。
  goal_en: Implement pairwise reward ranking and one-step clean prediction from a frozen rollout prefix.
  scope: 训练小型奖励评分器并通过冻结奖励函数更新单步噪声预测；不加载 BLIP 或图像解码器。
  scope_en: Train a small reward scorer and update an epsilon predictor through a fixed differentiable
    reward; no BLIP or image decoder.
  required_functions:
  - ranking_loss
  - refl_clean
  provided_functions: []
  optional: false
conventions:
  tensors: CPU float32/float64, preserve dtype/device; finite nonempty inputs. No in-place mutation.
  contract: ranking_loss accepts equal (B,) preferred/rejected scores. refl_clean accepts equal (B,D)
    latent/epsilon, alpha and sigma are amplitude coefficients (not cumulative variances), alpha>0, sigma>=0.
  autograd: Ranking differentiates both scores. ReFL stops the rollout latent and differentiates epsilon;
    the frozen reward model must still propagate gradients to its input.
