type: implement
parent: null
module:
  goal: 用独立样本估计非负 KL 基线，并对喜欢／不喜欢反馈优化 sigmoid 效用。
  goal_en: Estimate a nonnegative baseline from unrelated pairs and optimize sigmoid utility for binary
    feedback.
  scope: 输入已计算的每步 log-prob；实现 KTO 效用与停止梯度约定，不训练图像骨干。
  scope_en: Work with precomputed per-transition log probabilities; implement KTO utility and stop-gradient
    semantics without an image backbone.
  required_functions:
  - kto_loss
  provided_functions: []
  optional: false
conventions:
  tensors: CPU float32/float64, preserve dtype/device; finite nonempty inputs. No in-place mutation.
  contract: 'current/reference/labels: equal (B,) tensors; labels are exactly +1 or -1. unrelated_log_ratios:
    nonempty (M,). beta>0. Return mean negative centered sigmoid utility, with baseline max(mean(unrelated),0).'
  autograd: Only current log probabilities receive gradients. Reference, feedback labels and the unrelated-batch
    baseline are detached.
