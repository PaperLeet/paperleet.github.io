module:
  goal: 复用生成样本，通过多次重加噪和单步去噪构造低方差奖励梯度。
  goal_en: Reuse generated samples via re-noising and one-step denoising to aggregate reward gradients.
  scope: 实现 DRaFT-LV 额外样本的停止梯度与平均；初始生成过程由调用者提供。
  scope_en: Implement DRaFT-LV stop-gradient and averaging for extra samples; the initial differentiable
    generated sample is supplied.
  required_functions:
  - draft_lv_loss
  provided_functions: []
  optional: false
conventions:
  tensors: CPU float32/float64, preserve dtype/device; finite nonempty inputs. No in-place mutation.
  contract: generated (B,D), noises (K,B,D), K>=1; alpha>0 and sigma>=0 amplitudes. denoiser(x) returns
    (B,D); reward(x) returns (B,). Include original reward and K reconstructed rewards, averaged over
    K+1 and B.
  autograd: Original generated samples retain their reward gradient. Re-noising uses generated.detach()
    and frozen noises; additional gradients reach only the denoiser. Reward parameters are supplied/frozen
    by caller but input gradients remain live.
