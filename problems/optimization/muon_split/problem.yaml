conventions:
  seed: 42
  device: CPU; no downloads or pretrained weights
  dtype: Preserve float32/float64; oracle tests and toys use float64.
  polar: Exact SVD partial polar with relative rank cutoff max(head_dim,input_dim)*eps(dtype)*sigma_max.
    Declared exercise convention, not an asserted production GLM implementation.
  gradient: Autograd required only for full-rank blocks with distinct singular values; rank-boundary/repeated-singular-value
    derivatives excluded, forward remains defined.
