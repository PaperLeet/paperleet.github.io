mutants:
- id: m1_symmetric_clip
  bug: Use the lower width for both sides.
- id: m2_response_mean
  bug: Normalize within each response then average.
- id: m3_keep_all_success
  bug: Retain all-success groups.
- id: m4_old_gradient
  bug: Allow gradients into the behavior policy.
viz:
- toy_experiment
estimated_minutes: 25
formula: L=-\frac{\sum_{i,t}m_{it}\min(r_{it}A_i,\mathrm{clip}(r_{it},1-\epsilon_l,1+\epsilon_h)A_i)}{\sum_{i,t}m_{it}}
tags:
- Reinforcement Learning
- Post-training
- Policy Gradient
sources_verified: '2026-10-13'
module:
  goal: 筛选有效组，实现非对称的按 token 归一化截断目标。
  goal_en: Retain informative groups and implement asymmetric token-normalized clipping.
  scope: 两个有界核心函数；不复现超采样调度、超长奖励整形和分布式训练。
  scope_en: Two bounded core functions. Oversampling orchestration, overlong reward
    shaping, and distributed training are not reproduced.
  required_functions:
  - dynamic_group_mask
  - dapo_loss
  provided_functions: []
  optional: false
toy:
