id: rl/dapo
number: 13
title: DAPO 动态筛选与 Token 目标
title_en: DAPO Dynamic Filtering and Token Objective
paper_id: dapo
paper:
  title: 'DAPO: An Open-Source LLM Reinforcement Learning System at Scale'
  authors: Qiying Yu et al.
  venue: arXiv 2025
  arxiv: 2503.14476v1
  url: https://arxiv.org/abs/2503.14476v1
  anchors:
  - 'Section 3, Eqs. (8–11): token normalization, asymmetric clipping and dynamic
    sampling'
  - Sections 3.1–3.3; Section 4.1 clip_low=.2 and clip_high=.28
type: implement
parent: null
difficulty: M
functions:
- name: dynamic_group_mask
  signature: 'dynamic_group_mask(rewards: Tensor) -> Tensor'
- name: dapo_loss
  signature: 'dapo_loss(logp: Tensor, old_logp: Tensor, advantages: Tensor, mask:
    Tensor, clip_low: float=0.2, clip_high: float=0.28) -> Tensor'
conventions:
  scope: Two bounded core functions. Oversampling orchestration, overlong reward shaping,
    and distributed training are not reproduced.
  determinism: CPU, seed 42, two Torch threads; no downloads
tests:
  T0: 1
  T1: 1
  T2: 4
  T3: 1
