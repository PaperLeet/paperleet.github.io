mutants:
- id: m1_sample_mean
  bug: Mean reward loses the max-at-k objective.
- id: m2_raw_rewards
  bug: Raw per-sample rewards optimize pass-at-one.
- id: m3_sorted_output
  bug: Forget restoring original sample order.
- id: m4_double_normalization
  bug: Average weights that are already sample-normalized.
calibration:
