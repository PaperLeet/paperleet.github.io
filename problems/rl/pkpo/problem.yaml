toy:
  kind: paper_derived
  provenance: paper_derived
  source: https://arxiv.org/html/2505.15201v5
  anchor: 'Section 5.1 / Figure 1: one-dimensional Gaussian toy'
  adaptation: Recreates the Section 5.1 Gaussian/reward setup with 2048x16 samples on a smaller fixed CPU grid;
