title_en: DPO Preference Objective and Implicit Rewards
short_id: R3
title: DPO 偏好目标与隐式奖励
paper:
  title: 'Direct Preference Optimization: Your Language Model is Secretly a Reward Model'
  authors: Rafael Rafailov, Archit Sharma, Eric Mitchell, Stefano Ermon, Christopher D. Manning, Chelsea
    Finn
  venue: NeurIPS 2023
  arxiv: '2305.18290'
  anchors:
  - 'Eq. (4): optimal policy'
  - 'Eq. (7): DPO loss'
type: implement
parent: null
difficulty: E
functions:
- name: sequence_logprob
  signature: 'sequence_logprob(logits: Tensor, input_ids: Tensor, loss_mask: Tensor) -> Tensor'
- name: dpo_loss
  signature: 'dpo_loss(pi_chosen: Tensor, pi_rejected: Tensor, ref_chosen: Tensor, ref_rejected: Tensor,
    beta: float=0.1, label_smoothing: float=0.0) -> tuple[Tensor, Tensor, Tensor]'
conventions:
  layout: logits [B,T,V]；先右移标签/mask，再求回答 token log-prob 总和
  label_smoothing: 保守 DPO 混合正反标签，不是 robust DPO 的无偏噪声校正
