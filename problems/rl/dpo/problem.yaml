    policy_kl:
      reference: 0.00044954195618629456
      threshold: 0.0006743129342794418
paper_id: dpo
module:
  goal: 从策略与参考模型的序列分数实现偏好损失和隐式奖励。
  goal_en: Compute the preference loss and implicit rewards from policy and reference sequence scores.
  scope: 只实现 dpo_loss；序列 log-prob 聚合与小型训练实验已提供。
  scope_en: Implement only dpo_loss; sequence log-prob aggregation and the toy training experiment are
    supplied.
  required_functions:
  - dpo_loss
  provided_functions:
  - sequence_logprob
  optional: false

browser:
  backend: numpy-autograd-wasm
