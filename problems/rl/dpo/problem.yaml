  bug: 偏好边际忽略参考模型
- id: m2_omit_beta
  bug: 隐式奖励遗漏 beta 系数
- id: m3_naive_logsigmoid
  bug: log sigmoid 不稳定
- id: m4_reward_grad
  bug: 奖励未 detach
- id: m5_batch_sum
  bug: 偏好对求和代替 batch 平均
viz:
- shift_mask_grid
- loss_vs_margin
