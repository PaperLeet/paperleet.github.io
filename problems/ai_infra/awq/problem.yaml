toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2306.00978
  anchor: 'Section 3.2: activation-aware scaling search; official auto_scale.py _search_module_scale'
  adaptation: Use 16 deterministic calibration samples with one channel amplified eightfold and 3×4 weights
    under three-bit group quantization. Sweep eleven alpha values from zero to one and compare the selected
    candidate with alpha zero.
