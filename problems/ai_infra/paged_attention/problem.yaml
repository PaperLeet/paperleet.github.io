toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2309.06180
  anchor: Sections 4.1–4.4
  adaptation: Two synthetic CPU decode requests with scattered pages and one shared
    prefix are replayed for nine context lengths. Slot counts are analytic; no GPU
    throughput or CUDA speedup is claimed.
