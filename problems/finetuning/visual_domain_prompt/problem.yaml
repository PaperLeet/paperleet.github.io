- id: m2_average_domains
  bug: Average historical domains instead of summing.
- id: m3_unsquared_displacement
  bug: Use signed rather than squared displacement.
- id: m4_extra_half
  bug: Add an EWC-style half absent from Eq. (4).
- id: m5_train_anchor
  bug: Allow gradients into the previous-domain anchor.
