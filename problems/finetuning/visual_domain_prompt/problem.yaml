toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2212.04145
  anchor: 'Method, Eq. (1): additive domain-specific and domain-agnostic visual prompts'
  adaptation: Two-pixel identity readout, supplied fixed teacher features and supplied history; 120 SGD updates
    at lr=0.1 for strengths 0 and 1. Squared feature consistency replaces classifier cross entropy for an independent
    analytic optimum. Not CTTA benchmark reproduction.
mutants:
- id: m1_drop_agnostic
