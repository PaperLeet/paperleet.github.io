toy:
  kind: teaching_adaptation
  provenance: teaching_adaptation
  source: https://arxiv.org/html/2411.05007v1
  anchor: 'Figures 4-5: smoothing and outlier migration'
  adaptation: Controlled synthetic outlier channel demonstrating Eq.5, not a reproduction of diffusion-model image
    quality or Nunchaku speed.
  seed: 42
  device: cpu
  adaptation_zh: 受控离群通道展示 Eq.5，不复现扩散图像质量或 Nunchaku 性能。
mutants:
- id: m1_wrong_smoothing
  bug: Divide weights instead of compensating the input scale.
- id: m2_quantized_lowrank_input
  bug: Quantize activations in the high-precision branch too.
- id: m3_quantize_full_weight
  bug: Quantize full smoothed weight instead of its residual.
- id: m4_drop_singular_values
  bug: Drop the singular value scaling from low-rank factors.
calibration:
  seed: 42
  threads: 2
  dtype: float64
  method: One deterministic reference run with independent T1/T2 oracles and four rejected mutants; toy thresholds
    are exercise requirements, not paper benchmark scores.
