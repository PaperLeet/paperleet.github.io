    naive_relative_error: 0.16450124841021163
    smoothing_only_relative_error: 0.16485195842804903
    rank1_relative_error: 0.01215227894144383
    full_rank_relative_error: 7.085485912726332e-16
    smoothing_identity_error: 2.842170943040401e-14
    weight_absmax: 81.57007785157958
    residual_absmax: 3.3308383055314916
  max_observed_t3_s: 0.004359500948339701

