id: finetuning/svdquant
number: 46
title: SVDQuant 平滑、低秩与残差量化
title_en: SVDQuant Smoothing, Low-rank and Residual Quantization
paper_id: svdquant
paper:
  title: 'SVDQuant: Absorbing Outliers by Low-Rank Components for 4-Bit Diffusion Models'
  authors: Muyang Li et al.
  venue: ICLR 2025 Spotlight
  arxiv: 2411.05007v1
  url: https://arxiv.org/html/2411.05007v1
  anchors:
  - 'Section 3, Eq.1: symmetric quantization'
  - 'Section 4.2, Eq.5: high-precision low-rank and W4A4 residual'
  - 'Figures 4-5: smoothing and outlier migration'
type: implement
parent: null
difficulty: M
functions:
- name: smooth_inputs
  signature: 'smooth_inputs(x: Tensor, weight: Tensor, scale: Tensor) -> tuple[Tensor, Tensor]'
- name: split_weight
  signature: 'split_weight(weight: Tensor, rank: int) -> tuple[Tensor, Tensor, Tensor]'
- name: svdquant_linear
  signature: 'svdquant_linear(x: Tensor, weight: Tensor, scale: Tensor, rank: int, bits: int=4) -> Tensor'
- name: fake_quantize
  signature: 'fake_quantize(x: Tensor, bits: int=4)'
module:
  goal: 实现平滑、截断 SVD 和低精度残差双分支前向。
  goal_en: Implement smoothing, truncated SVD and a quantized residual two-branch forward.
  scope: 给定平滑系数及 INT fake quantizer；单次 SVD，无校准搜索、FP4、迭代细化或 GPU 内核。
  scope_en: Given smoothing factors and an INT fake quantizer; one SVD, no calibration search, FP4, iterative refinement
    or GPU kernels.
  required_functions:
  - smooth_inputs
  - split_weight
  - svdquant_linear
  provided_functions:
  - fake_quantize
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; preserve dtype/device and input values
  device: CPU; no downloads or pretrained weights
  weight_layout: X[B,M] and W[M,N], linear output X@W; inference numerical contract, no gradient tests
tests:
  T0: 2
  T1: 2
  T2: 4
  T3: 1
t3_budget_s: 10
estimated_minutes: 35
tags:
- Quantization
- Low-rank Approximation
- Diffusion
viz:
- toy_experiment
