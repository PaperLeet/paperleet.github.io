mutants:
- id: m1_uniform_codebook
  bug: Replace NF4 with uniform levels.
- id: m2_global_scale
  bug: Use global absmax for each block.
- id: m3_train_scales
  bug: Allow gradients into frozen scales.
- id: m4_missing_rank_scale
  bug: Forget adapter rank normalization.
viz:
- toy_experiment
