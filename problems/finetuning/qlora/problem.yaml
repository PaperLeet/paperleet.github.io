module:
  goal: 实现分块 NF4 量化，在冻结量化基座上训练 adapter。
  goal_en: Implement block NF4 quantization and train adapters through a frozen quantized
    base.
  scope: 三个 CPU 函数；索引用未打包 uint8 便于观察，不包含 4-bit 打包存储、双重量化和分页优化器。
  scope_en: Three CPU functions. Code indices are unpacked uint8 for inspectability;
    packed 4-bit storage, double quantization and paged optimizers are outside scope.
  required_functions:
  - nf4_quantize
  - nf4_dequantize
  - qlora_linear
  provided_functions: []
  optional: false
