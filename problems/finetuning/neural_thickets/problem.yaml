  source: https://arxiv.org/abs/2603.12228
  anchor: 'Section 4, Eqs. (3)-(5): weight perturbations, top-K expert selection and prediction ensembling'
  adaptation: 120 random two-parameter linear classifiers, scales 0.25/0.5/1, 41 selection samples, 9 selected experts
