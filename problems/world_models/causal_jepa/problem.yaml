toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2602.11389
  anchor: 'Section 4.2, Eq. (3): projected first-frame identity anchors and time embeddings; Section 4.2, Eqs. (5)-(6):
    masked-history and future prediction objectives'
  adaptation: Sixteen synthetic coupled-object trajectories use visible motion to reconstruct a masked object. A
    supplied linear probe replaces the transformer; no causal identification or CLEVRER score is claimed.
