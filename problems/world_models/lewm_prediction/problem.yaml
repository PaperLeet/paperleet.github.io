id: world_models/lewm_prediction
number: 58
title: LeWM 联合预测与潜在展开
title_en: LeWM Joint Prediction and Latent Rollout
paper:
  title: 'LeWorldModel: Stable End-to-End Joint-Embedding Predictive Architecture from Pixels'
  authors: Lucas Maes, Quentin Le Lidec, Damien Scieur, Yann LeCun, Randall Balestriero
  venue: arXiv 2026
  arxiv: '2603.19312'
  url: https://arxiv.org/abs/2603.19312
  anchors:
  - 'Section 3.1, Eqs. (1)-(3): teacher forcing, end-to-end gradients and SIGReg'
  - 'Section 3.2: action-conditioned autoregressive latent rollout'
paper_id: lewm
difficulty: M
functions:
- name: lewm_objective
  signature: 'lewm_objective(embeddings: Tensor, actions: Tensor, predictor: Callable, regularizer: Callable, weight:
    float = 0.1) -> tuple[Tensor, Tensor, Tensor]'
- name: latent_rollout
  signature: 'latent_rollout(initial: Tensor, actions: Tensor, transition: Callable) -> Tensor'
type: implement
parent: null
module:
  goal: 实现保留双向编码器梯度的下一状态预测目标，以及动作条件潜在状态递推。
  goal_en: Implement next-state teacher forcing with both encoder paths differentiable, then recursively roll out
    action-conditioned latent states.
  scope: 编码器、因果预测器与 SIGReg 由调用方提供；实现时间对齐、损失组合和单状态上下文展开。
  scope_en: Encoder, causal predictor and SIGReg are supplied by the caller. Implement temporal alignment, objective
    composition and single-state-context rollout.
  required_functions:
  - lewm_objective
  - latent_rollout
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; preserve dtype/device and do not mutate inputs
  device: CPU; no downloads or pretrained weights
  shape: embeddings (B,T,D), T>=2; actions (B,T-1,A); initial (B,D), rollout actions (B,H,A), H>=1.
  objective: Mean over B,T-1,D of squared next-step error + weight * regularizer(embeddings.transpose(0,1)); no
    (1-weight) prediction coefficient.
  autograd: No detach on embeddings, future targets, actions or recursively predicted states. Caller supplies a
    causal predictor and a differentiable scalar regularizer.
  rollout: N=1 Markov teaching restriction; output contains H predicted states, excluding initial. Full history-window
    transformer is supplied context.
tests:
  T0: 2
  T1: 2
  T2: 3
  T3: 1
t3_budget_s: 10
estimated_minutes: 30
