id: world_models/lewm_planning
number: 59
title: LeWM 潜在空间 CEM 规划
title_en: LeWM Latent CEM Planning
paper:
  title: 'LeWorldModel: Stable End-to-End Joint-Embedding Predictive Architecture from Pixels'
  authors: Lucas Maes, Quentin Le Lidec, Damien Scieur, Yann LeCun, Randall Balestriero
  venue: arXiv 2026
  arxiv: '2603.19312'
  url: https://arxiv.org/abs/2603.19312
  anchors:
  - 'Section 3.2, Eqs. (4)-(5): terminal latent-goal cost'
  - 'Appendix B, Algorithm 2: Cross-Entropy Method elite refit'
paper_id: lewm
difficulty: M
functions:
- name: terminal_cost
  signature: 'terminal_cost(rollouts: Tensor, goal: Tensor) -> Tensor'
- name: cem_refit
  signature: 'cem_refit(candidates: Tensor, costs: Tensor, num_elites: int) -> tuple[Tensor, Tensor, Tensor]'
type: implement
parent: null
module:
  goal: 用最终潜在状态给动作序列打分，并从最优候选重估 CEM 采样分布。
  goal_en: Score action sequences by their terminal latent state and refit the CEM sampling distribution from elites.
  scope: 实现终态代价与对角高斯精英统计；采样循环、冻结动力学模型及动作边界已提供。
  scope_en: Implement terminal scoring and diagonal-Gaussian elite statistics; the sampling loop, frozen transition
    model and action bounds are supplied.
  required_functions:
  - terminal_cost
  - cem_refit
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; preserve dtype/device and do not mutate inputs
  device: CPU; no downloads or pretrained weights
  shape: rollouts (N,H,D), goal (D,), candidates (N,H,A), costs (N,), H>=1.
  cost: Squared L2 of final latent state only; sum across features, no intermediate-state or action cost.
  selection: Lowest K costs, 1<=K<=N; ties use ascending original candidate index.
  gaussian: Return diagonal population variance, divide by K, not K-1; K=1 gives zero. Return variance, not standard
    deviation; sampling loop takes sqrt.
  scope: No momentum, variance floor or best-candidate injection inside refit. Supplied loop clamps sampled actions;
    refit statistics use the resulting candidates.
tests:
  T0: 2
  T1: 2
  T2: 3
  T3: 1
