module:
  goal: 实现干净数据预测与速度空间监督，在高维嵌入数据上比较 x/epsilon/v 输出。
  goal_en: Implement clean-data prediction with velocity-space supervision and compare
    x/epsilon/v outputs on embedded data.
  scope: 实现 make_noisy, prediction_to_velocity, velocity_loss；toy.py 提供训练与可视化脚手架。
  scope_en: Implement make_noisy, prediction_to_velocity, velocity_loss. toy.py provides
    the training and visualization scaffold.
  required_functions:
  - make_noisy
  - prediction_to_velocity
  - velocity_loss
  provided_functions: []
  optional: false
toy:
  provenance: Paper experiment reimplementation, reduced
  description: 根据 Figure 2 固定正交 2D→D 投影思想重实现，数据选用合成螺旋。默认 D=16、宽32、深3、160步；原文维度为2/8/16/512、宽256、深5。使用
    toy.py 的 --impl 与 --full --steps 5000 可运行原维度/网络扫描；步数和螺旋数据为教学选择。短程结果不保证原论文排序，未找到原
    toy 源码。 depth 计入输出层的全部 Linear 层。
  description_en: Reimplements the fixed orthogonal 2D→D embedding idea in Figure
    2 with synthetic spiral data. Default D=16, width=32, depth=3, 160 steps; the
    original uses D=2/8/16/512 and width=256, depth=5. Run `python problems/diffusion/jit/toy.py
    --impl problems/diffusion/jit/solution.py --full --steps 5000` for that dimension/architecture
    sweep; the step count and spiral distribution are our choices. Short-run comparisons
    are observations, not a guarantee of the paper ranking. No original toy source
    was found. Depth counts all Linear layers including the output.
  source: https://arxiv.org/html/2511.13720v1#S3.SS3
  seed: 42
  entrypoint: toy.py:run
  full_reproduction: false
