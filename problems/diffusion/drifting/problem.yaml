toy:
  provenance: Official toy adaptation
  description: 改编作者 Swiss-roll/checkerboard notebook：从 noise32→3×256、batch2048、2000步缩为
    noise8→2×48、生成96/正样本128、260步、temperature=.2，适合CPU判题。不含预训练特征、CFG或图像基准；论文 Figure
    3 的双峰实验是另一个实验。 归一化核改用 logsumexp，移除 notebook 的绝对乘积下限，以避免共同指数下溢。
  description_en: Adapts the authors’ Swiss-roll/checkerboard notebook. Reduced from
    noise32→3×256, batch2048, 2000 steps to noise8→2×48, generated96/positive128,
    260 steps and temperature .2 for CPU grading. No pretrained features, CFG, or
    image benchmarks. Paper Figure 3 is a separate bimodal experiment. The normalized
    kernel uses logsumexp instead of the notebook’s absolute product floor to avoid
    common exponential underflow.
  source: https://github.com/lambertae/lambertae.github.io/blob/a7fa4baae52abbab2aaeb57136d557caee79ff39/projects/drifting/notebooks/drifting_model_demo.ipynb
