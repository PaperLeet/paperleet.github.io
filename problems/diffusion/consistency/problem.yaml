module:
  goal: 实现保持边界的 consistency 函数、冻结相邻时间目标的损失与 EMA 更新。
  goal_en: Implement a boundary-preserving consistency function, stop-gradient pair
    loss, and EMA target update.
  scope: 实现 consistency_function, consistency_loss, update_ema；toy.py 提供训练与可视化脚手架。
  scope_en: Implement consistency_function, consistency_loss, update_ema. toy.py provides
    the training and visualization scaffold.
  required_functions:
  - consistency_function
  - consistency_loss
  - update_ema
  provided_functions:
  - teacher_euler
  optional: false
toy:
  provenance: PaperLeet teaching adaptation
  description: 单点数据教师使概率流 Euler 步精确。小型 MLP 蒸馏验证边界和目标梯度路径，无需预训练模型。一半训练对使用 EMA 网络的正相邻
    sigma/2 目标；另一半连接严格 sigma_min 边界。
  description_en: A point-data teacher makes its probability-flow Euler step exact.
    Small MLP distillation exercises the boundary and target routing without pretrained
    models. Half the training pairs use positive adjacent sigma/2 targets from the
    EMA network; half anchor the exact sigma_min boundary.
  source: https://github.com/openai/consistency_models/blob/e32b69ee436d518377db86fb2127a3972d0d8716/cm/karras_diffusion.py
  seed: 42
  entrypoint: toy.py:run
  full_reproduction: false
