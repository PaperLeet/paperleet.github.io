module:
  goal: 实现分布匹配生成器梯度、配对回归与独立的 fake-score 更新。
  goal_en: Implement the distribution-matching generator gradient, paired regression,
    and separate fake-score update.
  scope: 实现 score_difference, dmd_loss, fake_score_loss；toy.py 提供训练与可视化脚手架。
  scope_en: Implement score_difference, dmd_loss, fake_score_loss. toy.py provides
    the training and visualization scaffold.
  required_functions:
  - score_difference
  - dmd_loss
  - fake_score_loss
  provided_functions: []
  optional: false
toy:
  provenance: PaperLeet teaching adaptation
  description: 平移二维高斯生成器和可训练高斯 fake score 展示分数符号、梯度隔离与配对回归。这不是论文 Figure 3 双峰原代码，而是用解析分数隔离相同分布匹配机制。第二个
    T3 与参考预览增加 **Figure 3 启发的双峰改编实验**：解析双高斯学生的两个中心都从右侧附近出发，比较仅真实分数、分数差匹配、匹配加配对 MSE
    回归。这里教师和 fake score 都使用解析混合分数以隔离生成器梯度；第一个高斯 T3 单独验证 fake score 训练。CPU 运行600步，噪声
    sigma 从1.5降至0.6，目标中心为 (-1.8,0)/(1.8,0)，分量标准差 .25，报告每个模式占比和覆盖数。这些配置与曲线是 PaperLeet
    重实现，不是原 Figure 3 数据或源码。
  description_en: A shifted 2D Gaussian generator and trainable Gaussian fake score
    expose score signs, gradient isolation, and paired regression. This is not the
    paper’s Figure 3 bimodal source code; it isolates the same distribution-matching
    mechanism with analytic scores.The second T3 experiment and the reference preview
    add a **Figure-3-inspired bimodal adaptation**. An analytic two-Gaussian student
    begins with both means near the right mode. Compare real-score-only, score-difference
    distribution matching, and matching plus paired MSE regression. Teacher and fake
    scores are exact mixture scores here, so this experiment isolates generator gradients;
    the first Gaussian T3 separately trains the fake score. Use noise sigma 1.5→0.6
    over 600 CPU updates, target centers (-1.8,0)/(1.8,0), and component std .25.
    Report both mode proportions and covered-mode count. These settings and curves
    are PaperLeet’s reimplementation, not original Figure 3 data or source code.
  source: https://arxiv.org/abs/2311.18828v1
  seed: 42
  entrypoint: toy.py:run_bimodal
  full_reproduction: false
