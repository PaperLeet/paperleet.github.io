module:
  goal: 在分布匹配基础上实现 critic/生成器更新比例和非饱和 GAN 项。
  goal_en: Implement the critic-to-generator update ratio and non-saturating GAN contribution
    on top of distribution matching.
  scope: 实现 generator_due, adversarial_losses, generator_loss；toy.py 提供训练与可视化脚手架。
  scope_en: Implement generator_due, adversarial_losses, generator_loss. toy.py provides
    the training and visualization scaffold.
  required_functions:
  - generator_due
  - adversarial_losses
  - generator_loss
  provided_functions: []
  optional: false
toy:
  provenance: PaperLeet teaching adaptation
  description: 非配对平移高斯 toy 将 fake-score 和判别器训练5次再更新学生1次，展示调度、GAN梯度方向与移除配对回归。用高斯分数参数替代预训练扩散特征。
  description_en: An unpaired shifted-Gaussian toy jointly trains a fake score and
    discriminator for five updates per student update. It demonstrates scheduling,
    GAN gradient direction, and removal of paired regression. Uses scalar Gaussian
    score parameters rather than pretrained diffusion features.
  source: https://github.com/tianweiy/DMD2/blob/8d8fa55633d47cfb81bbc7a892e7248f9518763f/main/edm/edm_guidance.py
  seed: 42
  entrypoint: toy.py:run
  full_reproduction: false
