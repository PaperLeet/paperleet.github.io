  - https://github.com/google-research/google-research/tree/0a1b0fe7298a58bca6dcb47112379d829bc0c0a5/diffusion_distillation
module:
  goal: 求出使学生一步 DDIM 精确匹配教师两步的干净数据目标，并训练学生。
  goal_en: Derive the exact clean prediction that makes one student DDIM step match
    two teacher steps, then learn it.
  scope: 实现 ddim_step, distilled_target, distillation_loss；toy.py 提供训练与可视化脚手架。
  scope_en: Implement ddim_step, distilled_target, distillation_loss. toy.py provides
    the training and visualization scaffold.
  required_functions:
  - ddim_step
  - distilled_target
  - distillation_loss
  provided_functions:
  - teacher_pair
  optional: false
toy:
  provenance: PaperLeet teaching adaptation
  description: 固定仿射去噪教师在余弦调度下走两步 DDIM，小型线性学生学习解出的目标，一次前向匹配终点。演示精确蒸馏代数，不代表图像质量或多阶段反复减半。
  description_en: A fixed affine denoiser teacher takes two cosine-schedule DDIM steps;
    a tiny linear student learns the solved target and matches the endpoint in one
    evaluation. Demonstrates the exact distillation algebra, not image quality or
    repeated multi-stage halving.
  source: https://github.com/google-research/google-research/tree/0a1b0fe7298a58bca6dcb47112379d829bc0c0a5/diffusion_distillation
  seed: 42
  entrypoint: toy.py:run
  full_reproduction: false
