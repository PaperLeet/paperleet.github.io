title_en: 'Progressive Distillation: Two Teacher Steps to One'
paper:
  title: Progressive Distillation for Fast Sampling of Diffusion Models
  arxiv: '2202.00512'
  anchors:
  - arXiv v1 §3 Progressive distillation
  - Algorithm 2 and Appendix B distillation target
  version: v1
  authors: Tim Salimans, Jonathan Ho
  venue: ICLR 2022
