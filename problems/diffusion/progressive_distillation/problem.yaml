  signature: 'ddim_step(noisy: Tensor, clean_prediction: Tensor, alpha_t: Tensor,
    sigma_t: Tensor, alpha_s: Tensor, sigma_s: Tensor) -> Tensor'
- name: distilled_target
  signature: 'distilled_target(noisy: Tensor, teacher_endpoint: Tensor, alpha_t: Tensor,
    sigma_t: Tensor, alpha_s: Tensor, sigma_s: Tensor) -> Tensor'
- name: distillation_loss
  signature: 'distillation_loss(prediction: Tensor, target: Tensor, weight: Tensor)
    -> Tensor'
- name: teacher_pair
  signature: 'teacher_pair(teacher, noisy: Tensor, t: Tensor, midpoint: Tensor, end:
    Tensor) -> Tensor'
