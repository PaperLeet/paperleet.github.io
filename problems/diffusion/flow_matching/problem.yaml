paper_id: flow-matching
module:
  goal: 实现线性条件路径、目标速度和条件 Flow Matching 损失。
  goal_en: Implement the linear conditional path, target velocity, and conditional Flow Matching loss.
  scope: 实现 interpolate、cfm_target 和 cfm_loss；时间采样、Euler 求解器和测试训练循环已提供。
  scope_en: Implement interpolate, cfm_target, and cfm_loss. Time sampling, the Euler solver, and the
    test training loop are provided.
  required_functions:
  - interpolate
  - cfm_target
  - cfm_loss
  provided_functions:
  - sample_t
  - euler_sample
  optional: false

browser:
  backend: numpy-autograd-wasm
  packages: [pyyaml]
  resources:
