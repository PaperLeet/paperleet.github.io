  source: https://arxiv.org/abs/2604.28190
  anchor: 'Section 3.2, Eqs. (3)-(5): raw feature moments and EMA covariance; Algorithm 1: stopped history, current-batch
    gradients; Appendix B.3: warm start'
  adaptation: Forty alternating microbatches from two shifted 2D components, warm-started from the known eight-point
    population, compare batch and EMA moment error. This is a teaching construction, not a paper figure or ImageNet
    run.
