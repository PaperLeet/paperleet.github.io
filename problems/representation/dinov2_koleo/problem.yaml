toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2304.07193
  anchor: KoLeo regularizer in the training recipe
  adaptation: Six learnable 3D vectors, 18 parameters, 100 actual SGD updates at lr .06; measures sphere spacing
    with KoLeo alone, not full DINOv2 or downstream image performance.
mutants:
- id: m1_self_neighbor
  bug: Include the anchor itself as a neighbor.
- id: m2_farthest
  bug: Select farthest non-self vectors.
- id: m3_no_normalize
  bug: Compute neighbors and distances on raw features.
- id: m4_detach_neighbor
  bug: Detach selected neighbors and lose their endpoint gradients.
- id: m5_wrong_sign
  bug: Minimize positive log distance.
- id: m6_missing_pair_epsilon
  bug: Omit the official PairwiseDistance coordinate epsilon.
- id: m7_sum_loss
  bug: Sum regularization over the batch.
- id: m8_fixed_norm_floor
  bug: Fix normalization epsilon at 1e-12 instead of using the caller floor.
