toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/1805.01978
  anchor: 'Section 3.2: noise-contrastive estimation'
  adaptation: Six normalized learnable instance vectors, indexed bank EMA .95, fixed Z=exp(5)+5, 80 actual SGD steps.
    Enumerating the five other toy instances is a deterministic teaching schedule, not reproduction of the original
    stochastic noise sampler.
mutants:
- id: m1_infonce
  bug: Use candidate softmax instead of original binary NCE.
- id: m2_wrong_noise
  bug: Use 1/N instead of K/N noise prior.
- id: m3_bank_gradient
  bug: Let the persistent memory receive autograd gradients.
- id: m4_average_noise
  bug: Average the noise terms rather than summing them.
- id: m5_reverse_momentum
  bug: Swap old/new weights in the memory EMA.
- id: m6_no_bank_normalize
  bug: Store unnormalized EMA rows.
- id: m7_ignore_z
  bug: Ignore the fixed partition constant.
- id: m8_fixed_norm_floor
  bug: Ignore the caller epsilon in the memory row norm floor.
- id: m9_alias_frozen_bank
  bug: Return the original bank storage at momentum one without normalizing selected rows.
