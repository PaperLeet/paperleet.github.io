functions:
- name: sinkhorn_assignments
  signature: 'sinkhorn_assignments(scores: Tensor, epsilon: float = .05, iterations: int = 3) -> Tensor'
- name: swapped_prediction_loss
  signature: 'swapped_prediction_loss(scores1: Tensor, scores2: Tensor, assignments1: Tensor, assignments2: Tensor,
    temperature: float = .1) -> Tensor'
module:
  goal: 实现单进程有限步 Sinkhorn 平衡软分配，再以另一视图的分配训练当前视图。
  goal_en: Implement finite-iteration single-process Sinkhorn assignments and cross-view soft-target prediction.
  scope: 输入为原型分数；两个函数和 80 步合成分数表优化，不包含图像编码器、队列或原型参数训练。
  scope_en: Prototype scores are inputs; two functions and 80 synthetic score-table updates, without image encoders,
    queues or prototype-parameter training.
  required_functions:
  - sinkhorn_assignments
  - swapped_prediction_loss
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: Preserve shared float32/float64 dtype and device; support strided inputs and do not modify inputs.
  device: CPU; no downloads or pretrained weights.
  layout: All score/assignment tensors share nonempty [B,K], B>=1,K>=1.
  sinkhorn: Initialize K-by-B mass proportional to exp(scores.T/epsilon); repeat prototype row normalization to
    1/K then sample column normalization to 1/B; return B*Q.T detached. Log-domain arithmetic preserves these finite
    iterations.
  marginals: Returned sample rows sum to one; prototype column sums approach B/K, not necessarily exact at finite
    iterations.
  loss: Average CE(q2,softmax(scores1/tau)) and CE(q1,softmax(scores2/tau)), mean over examples. Assignments are
    detached nonnegative rows summing to one within 1e-5.
  parameters: epsilon and temperature are finite positive Python scalars; iterations is a positive Python int, not
    bool.
