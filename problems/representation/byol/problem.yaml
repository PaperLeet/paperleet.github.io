functions:
- name: byol_loss
  signature: 'byol_loss(p1: Tensor, p2: Tensor, z1: Tensor, z2: Tensor, eps: float = 1e-12) -> Tensor'
- name: ema_update
  signature: 'ema_update(online: Tensor, target: Tensor, momentum: float = .99) -> Tensor'
module:
  goal: 实现双向归一化回归与停止梯度的参数 EMA，理解 BYOL 的缓慢目标网络。
  goal_en: Implement symmetric normalized regression and detached parameter EMA for a slowly moving BYOL target.
  scope: 两个函数，配套 80 步向量表与线性预测头训练及目标 EMA；不实现图像编码器或下游基准。
  scope_en: Two functions with 80 table/linear-predictor updates and target EMA; no image encoder or downstream
    benchmark.
  required_functions:
  - byol_loss
  - ema_update
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: Preserve shared float32/float64 dtype and device; support strided inputs and do not modify inputs.
  device: CPU; no downloads or pretrained weights.
  layout: Loss inputs share finite [B,D], B>=1,D>=1. EMA accepts arbitrary matching nonempty parameter shapes.
  normalization: Normalize by sqrt(max(sum of squares,eps)); default squared-norm floor 1e-12 follows official JAX
    helper, not a norm floor of 1e-12.
  reduction: Sum both crossed directional squared distances, then mean over B. Do not divide by two or D.
  autograd: Loss updates only predictions; both targets are detached. EMA detaches both inputs, returns independent
    storage and never mutates inputs.
  momentum: Finite Python scalar in [0,1]; m=1 freezes target and m=0 copies online. eps is finite positive Python
    scalar.
