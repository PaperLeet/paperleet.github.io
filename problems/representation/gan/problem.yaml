- id: m3_real_label
  bug: Assign real samples the fake target
- id: m4_fake_label
  bug: Assign fake discriminator samples the real target
- id: m5_extra_half
  bug: Average the two expectations again
- id: m6_detached_generator
  bug: Detach generator loss from its logits
