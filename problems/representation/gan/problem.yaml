module:
  goal: 实现判别器的两个独立期望，以及稳定、可微的非饱和生成器目标。
  goal_en: Implement the discriminator's two independently averaged expectations and the stable differentiable non-saturating
    generator objective.
  scope: 补全 logits 损失；提供一维高斯位置的真实交替训练，不实现图像 GAN、完整网络或稳定收敛保证。
  scope_en: Complete logit losses; a supplied one-dimensional Gaussian location game performs actual alternating
    training. Image GANs, complete networks and convergence guarantees are outside scope.
