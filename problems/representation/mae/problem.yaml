  source: https://arxiv.org/abs/2111.06377
  anchor: 'Section 3: reconstruction target and normalized pixel loss'
  adaptation: 120 real Adam updates, lr .06, train a shared 3-to-4 linear decoder from 24 deterministic
    synthetic context vectors to fixed pixels. No image encoder or benchmark claim.
