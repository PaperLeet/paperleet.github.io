functions:
- name: reparameterize
  signature: 'reparameterize(mu: Tensor, logvar: Tensor, noise: Tensor) -> Tensor'
- name: gaussian_kl
  signature: 'gaussian_kl(mu: Tensor, logvar: Tensor) -> Tensor'
- name: negative_elbo
  signature: 'negative_elbo(logits: Tensor, target: Tensor, mu: Tensor, logvar: Tensor) -> Tensor'
module:
  goal: 实现可微高斯采样、对标准正态的解析 KL，以及稳定的 Bernoulli 负 ELBO。
  goal_en: Implement differentiable Gaussian sampling, analytic KL to a standard normal and a stable Bernoulli negative
    ELBO.
  scope: 补全三个函数；编码器、解码器和合成二值模式的 120 步训练由实验提供，不复现 MNIST 或图像生成指标。
  scope_en: Complete three functions; the supplied encoder/decoder train for 120 steps on synthetic binary patterns.
    No MNIST or image-generation benchmark is reproduced.
  required_functions:
  - reparameterize
  - gaussian_kl
  - negative_elbo
  provided_functions: []
  optional: false
conventions:
  posterior: mu, logvar, noise share [B,Z], Z > 0; logvar = log(sigma^2), never log(sigma); noise is provided, not
    sampled internally
  kl: Return positive KL(q||N(0,I)) with shape [B], summing Z; no detach
  observations: logits and target share nonempty [B,F]; target in [0,1]; posterior has same B
  objective: Negative ELBO = batch mean of (sum_F Bernoulli NLL + sum_Z KL); one posterior sample, original KL coefficient
    1
  stability: Compute Bernoulli NLL in logit space, without log(sigmoid) or probability clipping
  purity: Preserve differentiable paths and matching float32/float64 dtype/device; no mutation; sampling and KL
    accept B=0; objective requires B>0
