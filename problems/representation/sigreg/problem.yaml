  bug: 遗漏 Epps-Pulley 统计量的样本数 N
- id: m3_missing_symmetry
  bug: 正半轴积分忘记乘以2
- id: m4_standardize_features
  bug: 先标准化投影使目标的均值与尺度约束失效

