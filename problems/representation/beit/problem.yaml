toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2106.08254
  anchor: 'Section 2: masked image modeling with discrete visual tokens'
  adaptation: 100 real Adam updates, lr .08, train a shared 4-class linear head on six masked positions
    among twelve deterministic synthetic contexts. No tokenizer or benchmark pretraining.
mutants:
- id: m1_all_tokens
  bug: Include visible positions in the objective
- id: m2_visible_tokens
  bug: Select visible rather than masked positions
- id: m3_batch_divisor
  bug: Divide summed token errors by batch size
- id: m4_probabilities_as_scores
  bug: Apply softmax before the logit cross entropy
- id: m5_wrong_label
  bug: Shift every target class by one
- id: m6_stopped_logits
  bug: Detach the selected logits
- id: m7_wrong_sign
  bug: Maximize rather than minimize negative log likelihood
- id: m8_strided_logits_stop
  bug: Detach only noncontiguous vocabulary scores
- id: m9_gather_visible_ids
  bug: Gather all token IDs before masking and only sanitize negative sentinels
