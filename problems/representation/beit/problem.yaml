id: representation/beit
number: 183
title: BEiT 掩码离散视觉 Token 预测
title_en: BEiT Masked Discrete Visual Token Prediction
paper_id: beit
paper:
  title: 'BEiT: BERT Pre-Training of Image Transformers'
  authors: Hangbo Bao, Li Dong, Songhao Piao, Furu Wei
  venue: ICLR 2022
  arxiv: '2106.08254'
  url: https://arxiv.org/abs/2106.08254
  anchors:
  - 'Section 2: masked image modeling with discrete visual tokens'
  - 'Official engine_for_pretraining.py: input_ids[bool_masked_pos] and CrossEntropyLoss'
  official_code: https://github.com/microsoft/unilm/tree/master/beit
parent: null
type: implement
difficulty: M
functions:
- name: masked_token_cross_entropy
  signature: 'masked_token_cross_entropy(logits: Tensor, token_ids: Tensor, mask: Tensor) -> Tensor'
module:
  goal: 从完整 patch logits 中选取遮挡位置，对固定离散视觉 token 计算稳定交叉熵。
  goal_en: Select masked patch logits and compute stable cross-entropy against fixed discrete visual token
    IDs.
  scope: 实现预先给定 token IDs 的损失核心；CPU 实验训练共享 token 分类头，不训练 tokenizer 或 ViT。
  scope_en: Implement the loss core with supplied token IDs; a CPU experiment learns a shared token head
    without training a tokenizer or ViT.
  required_functions:
  - masked_token_cross_entropy
  provided_functions: []
  optional: false
conventions:
  seed: 42
  layout: '[B,N,K] logits; int64 [B,N] token_ids; boolean [B,N] mask, True means supervised masked position'
  dtype: Finite float32/float64 logits; matching nonempty batch and patch axes and shared device.
  labels: Masked IDs lie in [0,K). Unselected IDs are ignored and may be sentinel values.
  reduction: Global mean over masked tokens. Empty mask returns differentiable zero; K=1 is valid.
  gradients: Only logits are differentiable; visible logits have zero gradient. Use stable log-sum-exp
    or log-softmax.
tests:
  T0: 2
  T1: 2
  T2: 3
  T3: 1
t3_budget_s: 10
estimated_minutes: 25
tags:
- Representation Learning
- Self-Supervised Learning
- Masked Image Modeling
- Discrete Tokens
viz:
- toy_experiment
browser:
  backend: numpy-autograd-wasm
sources_verified: '2026-11-06'
verified_sources:
