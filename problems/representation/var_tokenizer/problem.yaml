id: representation/var_tokenizer
number: 51
title: VAR 多尺度残差量化
title_en: VAR Multiscale Residual Quantization
paper:
  title: 'Visual Autoregressive Modeling: Scalable Image Generation via Next-Scale
    Prediction'
  authors: Keyu Tian et al.
  venue: NeurIPS 2024
  arxiv: '2404.02905'
  url: https://arxiv.org/html/2404.02905v2
  anchors:
  - 'Section 3.2: next-scale prediction'
  - 'Algorithms 1–2: residual multiscale VQ'
  - 'Figure 4: training inputs and block causal mask'
paper_id: var
type: implement
parent: null
difficulty: M
functions:
- name: multiscale_quantize
  signature: 'multiscale_quantize(features: Tensor, codebook: Tensor, scales: list[int],
    projections: Tensor) -> tuple[list[Tensor], list[Tensor]]'
- name: decode_multiscale
  signature: 'decode_multiscale(token_maps: list[Tensor], codebook: Tensor, projections:
    Tensor) -> Tensor'
- name: lift_codes
  signature: 'lift_codes(tokens: Tensor, codebook: Tensor, projection: Tensor, full_size:
    int) -> Tensor'
- name: resize_residual
  signature: 'resize_residual(residual: Tensor, size: int) -> Tensor'
module:
  goal: 从粗到细量化剩余特征，并在最大分辨率累计重建。
  goal_en: Quantize residual features from coarse to fine and accumulate full-resolution
    reconstructions.
  scope: 给定编码特征、共享码本与尺度投影，仅实现冻结 tokenizer 的编码和解码；不训练 VQ-VAE。
  scope_en: Given features, a shared codebook and scale projections, implement frozen
    tokenizer encoding and decoding; VQ-VAE training is outside scope.
  required_functions:
  - multiscale_quantize
  - decode_multiscale
  provided_functions:
  - lift_codes
  - resize_residual
  optional: false
conventions:
  seed: 42
  dtype: Finite CPU float32/float64 inputs, shared dtype/device; frozen tokenizer
    outputs require no gradients.
  scales: Strictly increasing square resolutions, starting at 1; largest scale equals
    full latent size.
  projection: Supplied Phi is a fixed C×C channel map after bicubic upsampling, a
    teaching simplification of trained spatial convolution.
  codebook: Shared [V,C] Euclidean codebook; exact nearest-distance ties select the
    lowest index.
tests:
  T0: 2
  T1: 2
  T2: 3
  T3: 1
t3_budget_s: 10
estimated_minutes: 35
tags:
- Vector Quantization
- Residual Learning
- Multi-scale
viz:
- toy_experiment
sources_verified: '2026-10-13'
verified_sources:
  checked_at: '2026-10-13'
  links:
  - https://arxiv.org/html/2404.02905v2
  - https://github.com/FoundationVision/VAR/blob/main/models/quant.py
  - https://github.com/FoundationVision/VAR/blob/main/models/var.py
toy:
  kind: teaching_adaptation
  source: https://arxiv.org/html/2404.02905v2
  anchor: Section 3.2 and Algorithms 1–2; official models/quant.py
  adaptation: Small fixed latent maps and codebooks with supplied channel projections
    replace the trained spatial projection layers. No image dataset, pretrained VAE,
    or ImageNet reproduction.
mutants:
- id: m1_original_features
  bug: Quantizes original features again instead of the remaining residual.
- id: m2_add_residual
  bug: Adds the selected reconstruction back to the residual.
- id: m3_farthest_code
  bug: Selects the farthest code vector.
- id: m4_last_scale_only
  bug: Overwrites cumulative reconstructions with the latest contribution.

browser:
  backend: numpy-autograd-wasm
