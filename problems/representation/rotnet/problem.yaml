module:
  goal: 通过精确图像变换生成自监督标签，并实现四分类训练目标。
  goal_en: Generate self-supervised labels using exact image transformations and implement the four-way objective.
  scope: 实现四个逆时针旋转视图与分类损失；使用八张合成非对称图案训练线性分类器。
  scope_en: Implement four counterclockwise views and their classification loss; train a linear classifier on eight
    asymmetric synthetic glyphs.
  required_functions:
  - rotation_batch
  - rotation_loss
  provided_functions: []
  optional: false
conventions:
  seed: 42
  layout: images [B,C,H,H] -> views [4B,C,H,H], int64 labels [4B]; logits [M,4]
  dtype: Finite float32/float64; preserve dtype/device; int64 indices.
  device: CPU, no downloads or pretrained weights.
  contract: Rotation-major blocks 0/90/180/270 degrees CCW; labels 0/1/2/3 each repeated B times. Exact pixel permutations,
    no interpolation or detach. Stable mean CE for supplied labels; preserve floating dtype/device and input data.
