toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/1803.07728
  anchor: 'Section 3: image rotation prediction'
  adaptation: Eight 4x4 synthetic asymmetric glyphs, 32 rotations, a 16x4 linear head, 80 actual SGD updates at
    lr .6. Rotation training accuracy is not downstream representation quality.
mutants:
- id: m1_clockwise
  bug: Swap clockwise/counterclockwise 90-degree views.
- id: m2_tile_labels
  bug: Use sample-major labels for rotation-major views.
- id: m3_identity_180
  bug: Leave the 180-degree view unrotated.
- id: m4_detach_views
  bug: Detach augmented views from input images.
- id: m5_sum_loss
  bug: Sum instead of averaging cross entropy.
- id: m6_exp_overflow
  bug: Exponentiate unshifted logits.
- id: m7_first_channel
  bug: Drop all but the first image channel before generating rotated views.
