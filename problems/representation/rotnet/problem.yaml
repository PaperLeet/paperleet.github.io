  title: Unsupervised Representation Learning by Predicting Image Rotations
  authors: Spyros Gidaris, Praveer Singh, Nikos Komodakis
  venue: ICLR 2018
  arxiv: '1803.07728'
  url: https://arxiv.org/abs/1803.07728
