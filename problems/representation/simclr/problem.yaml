type: implement
parent: null
difficulty: M
functions:
- name: nt_xent_loss
  signature: 'nt_xent_loss(view1: Tensor, view2: Tensor, temperature: float = .5) -> Tensor'
module:
  goal: 实现包含同视图负样本的 2B 锚点 NT-Xent，并验证两组输入的梯度。
  goal_en: Implement NT-Xent over 2B anchors including same-view negatives, preserving gradients into
    both input views.
  scope: 只实现 NT-Xent；已提供 6 对向量的 CPU 训练实验，不训练图像编码器或复现论文基准。
  scope_en: Implement only NT-Xent; a supplied CPU lab trains 6 vector pairs, without an image encoder
    or paper benchmark reproduction.
  required_functions:
  - nt_xent_loss
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: Preserve shared float32/float64 input dtype. Tests use float64 for gradients.
  device: CPU; no downloads, pretrained weights or GPU.
  contract: Nonempty [B,D] views with finite values; finite positive Python temperature. Stack view1 then
    view2, normalize each row by max(L2 norm, 1e-12), mask only self, mean over all 2B anchors. Inputs
    are not modified.
tests:
  T0: 2
  T1: 1
  T2: 5
  T3: 1
