title: DINO 教师中心化与多视图蒸馏
title_en: DINO Teacher Centering and Multi-View Distillation
paper_id: dino
paper:
  title: Emerging Properties in Self-Supervised Vision Transformers
  authors: Mathilde Caron, Hugo Touvron, Ishan Misra, Hervé Jégou, Julien Mairal, Piotr Bojanowski, Armand Joulin
  venue: ICCV 2021
  arxiv: '2104.14294'
  url: https://arxiv.org/abs/2104.14294
  anchors:
  - 'Section 3: self-distillation, multi-crop, centering and sharpening'
  - Official main_dino.py DINOLoss.forward and DINOLoss.update_center
  official_code: https://github.com/facebookresearch/dino
type: implement
parent: null
difficulty: M
functions:
- name: teacher_probabilities
  signature: 'teacher_probabilities(teacher: Tensor, center: Tensor, temperature: float = .04) -> Tensor'
- name: dino_loss
  signature: 'dino_loss(student: Tensor, teacher: Tensor, center: Tensor, student_temperature: float = .1, teacher_temperature:
    float = .04) -> Tensor'
- name: update_center
  signature: 'update_center(center: Tensor, teacher: Tensor, momentum: float = .9) -> Tensor'
module:
  goal: 实现中心化锐化的停止梯度教师分布、多视图交叉熵和 raw-logit 中心 EMA。
  goal_en: Implement centered sharpened stopped teacher distributions, multi-view cross-entropy and raw-logit center
    EMA.
  scope: 三个函数和 80 步合成学生分数表训练；教师 logits 已给定，不实现 ViT、图像增强或教师参数 EMA。
  scope_en: Three functions and 80 synthetic student-score updates; teacher logits are given, without ViT, augmentations
    or teacher-parameter EMA.
  required_functions:
  - teacher_probabilities
  - dino_loss
  - update_center
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: Preserve shared float32/float64 dtype and device; support strided inputs and do not modify inputs.
  device: CPU; no downloads or pretrained weights.
  layout: teacher [2,B,K], student [V,B,K] with V>=2, center [K], B>=1,K>=1. First two student views match teacher
    global view indices.
  teacher: softmax((teacher-center)/teacher_temperature) is fully detached, including center. Student logits are
    only divided by student_temperature.
  pairing: Teacher view t supervises every student view v except v=t. Mean over examples and all 2*(V-1) pairs.
  center: EMA uses the mean raw teacher logits over both global views and batch; return detached independent [K]
    storage. Caller updates after computing loss with the previous center.
  parameters: Temperatures are finite positive Python scalars. Center momentum is a finite Python scalar in [0,1];
    bool and tensor scalars rejected.
tests:
  T0: 2
  T1: 1
  T2: 3
  T3: 1
t3_budget_s: 10
