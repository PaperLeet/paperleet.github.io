mutants:
- id: m1_no_center
  bug: Omit teacher centering.
- id: m2_no_sharpening
  bug: Ignore teacher temperature.
- id: m3_live_teacher
  bug: Train teacher logits instead of stopping them.
- id: m4_same_view_pairs
  bug: Include same-global-view pairs in the distillation loss.
- id: m5_sum_pairs
  bug: Sum rather than average multi-view terms.
- id: m6_ignore_student_temperature
  bug: Ignore student softmax temperature.
- id: m7_first_teacher_center
  bug: Update the center from only one global view.
- id: m8_reverse_center_ema
  bug: Reverse old center and batch-center EMA weights.
- id: m9_live_center_update
  bug: Retain gradients through the center update.
- id: m10_strided_detach
  bug: Detach the distillation loss only for strided student views.
- id: m11_truncate_views
  bug: Ignore all student crops after the third view.
