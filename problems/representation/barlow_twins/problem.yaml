toy:
  kind: teaching_adaptation
  source: https://proceedings.mlr.press/v139/zbontar21a.html
  anchor: Equations 1–2 and official single-batch BatchNorm implementation
  adaptation: Optimize two deterministic 16-by-3 embedding tables with 120 Adam updates, lr .04 and lambd .2. No data download, image encoder or benchmark claim.
mutants:
  - {id: m1_no_centering, bug: Skip batch centering}
  - {id: m2_sample_variance, bug: Use sample variance instead of population variance}
  - {id: m3_wrong_axis, bug: Standardize each row instead of each feature}
  - {id: m4_wrong_batch_divisor, bug: Divide cross-correlation by feature width}
  - {id: m5_diagonal_mean, bug: Average diagonal errors instead of summing}
  - {id: m6_upper_triangle_only, bug: Penalize only one off-diagonal triangle}
  - {id: m7_detach_second_view, bug: Stop the second view gradient}
  - {id: m8_epsilon_outside_sqrt, bug: Add epsilon after the square root}
  - {id: m9_ignore_lambda, bug: Ignore the off-diagonal weight}
