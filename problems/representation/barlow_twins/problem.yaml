title_en: Barlow Twins Cross-Correlation and Redundancy Reduction
paper_id: barlow-twins
paper:
  title: 'Barlow Twins: Self-Supervised Learning via Redundancy Reduction'
  authors: Jure Zbontar, Li Jing, Ishan Misra, Yann LeCun, Stephane Deny
  venue: ICML 2021
  arxiv: '2103.03230'
  url: https://proceedings.mlr.press/v139/zbontar21a.html
  anchors:
    - 'Equations 1–2: identity-target cross-correlation objective'
    - 'Official main.py BarlowTwins.forward: affine-free BatchNorm and summed penalties'
