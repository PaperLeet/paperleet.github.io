mutants:
- id: m1_inclusive_threshold
  bug: States exactly at the threshold are kept instead of replayed.
- id: m2_no_damping
  bug: PD control omits velocity damping.
- id: m3_time_mean
  bug: State matching averages the time horizon instead of summing it.
