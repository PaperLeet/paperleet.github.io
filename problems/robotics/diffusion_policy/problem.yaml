toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2303.04137
  anchor: 'Section 2.3, Eq. (5): observation-conditioned action noise prediction;
    Official diffusion_unet_lowdim_policy.py: noise_scheduler.add_noise and predict_action
    with oa_step_convention'
  adaptation: A two-coefficient conditional denoiser learns one fixed-noise-level
    batch of analytic 2D action trajectories. The execution slice is checked against
    separately indexed clean actions.
