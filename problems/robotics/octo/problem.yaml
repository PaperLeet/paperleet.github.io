module:
  goal: Octo 双重padding掩码归约：实现下列接口并通过数值、边界和实验检查。
  goal_en: 'Octo Dual Padding-Mask Reduction: implement the interfaces below and verify numerical, boundary
    and experimental behavior.'
  scope: 提取官方动作头的masked_mean及时间/动作padding交集；计算未乘额外action_dim系数的逐坐标平方误差，不实现扩散网络。
  scope_en: Isolate the action head masked_mean and intersection of timestep/action padding. Compute coordinatewise
    squared error before any head-specific action_dim scaling; omit the diffusion network.
  required_functions:
  - masked_action_loss
  provided_functions: []
  optional: false
functions:
- name: masked_action_loss
  signature: 'masked_action_loss(prediction: Tensor, target: Tensor, timestep_valid: Tensor, action_valid:
    Tensor) -> Tensor'
conventions:
  seed: 42
  device: CPU float32/float64; no downloads; preserve floating dtype/device; do not mutate inputs
  contract: Prediction/target are (B,W,H,D), timestep_valid bool (B,W), action_valid bool (B,W,H,D). Detach
    targets. All-padding returns differentiable zero. Retain the source denominator floor 1e-5.
