module:
  goal: DayDreamer 离散世界模型KL平衡：实现下列接口并通过数值、边界和实验检查。
  goal_en: 'DayDreamer Balanced Categorical World-Model KL: implement the interfaces below and verify
    numerical, boundary and experimental behavior.'
  scope: 提取DayDreamer继承DreamerV2的KL balancing核心，固定alpha默认0.8；计算free-nats截断之前的KL，不实现RSSM或机器人在线训练。
  scope_en: Isolate the DreamerV2-style KL balancing used by DayDreamer, with default alpha=0.8. Compute
    KL before free-nats clipping; omit the RSSM and online robot training.
  required_functions:
  - balanced_kl
  provided_functions: []
  optional: false
functions:
- name: balanced_kl
  signature: 'balanced_kl(posterior_logits: Tensor, prior_logits: Tensor, alpha: float=0.8) -> Tensor'
conventions:
  seed: 42
  device: CPU float32/float64; no downloads; preserve floating dtype/device; do not mutate inputs
  contract: Posterior/prior logits are (B,K,C), C>=2, alpha in [0,1]. Sum KL over K categorical latents
    and average B. Forward values are alpha-invariant while gradient allocation depends on alpha.
tests:
  T0: 1
