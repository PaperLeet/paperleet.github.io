id: robotics/rdt_1b
number: 142
title: RDT-1B 统一动作槽与有效维度
title_en: RDT-1B Unified Action Slots and Valid Dimensions
paper:
  title: 'RDT-1B: a Diffusion Foundation Model for Bimanual Manipulation'
  authors: Songming Liu et al.
  venue: ICLR 2025
  url: https://arxiv.org/abs/2410.07864
  anchors:
  - Physically interpretable unified action space; official RDTRunner.conditional_sample final action
    mask
  arxiv: '2410.07864'
paper_id: rdt-1b
difficulty: M
type: implement
parent: null
module:
  goal: 把不同机器人的局部动作放进统一语义槽，并屏蔽不存在的执行维度。
  goal_en: Place embodiment-specific actions in unified semantic slots and mask absent execution dimensions.
  scope: 提取RDT统一动作空间与采样输出mask；使用可配置小槽表，不复制完整128维schema或12亿参数Transformer。
  scope_en: Isolate unified action placement and final sampling masks using a configurable small slot
    map, not the complete 128D schema or 1.2B Transformer.
  required_functions:
  - pack_actions
  - mask_actions
  provided_functions: []
  optional: false
functions:
- name: pack_actions
  signature: 'pack_actions(local: Tensor, slots: list, width: int) -> tuple'
- name: mask_actions
  signature: 'mask_actions(actions: Tensor, valid: Tensor) -> Tensor'
conventions:
  seed: 42
  device: CPU float32/float64; no downloads; preserve floating dtype/device; do not mutate inputs
  contract: Local actions are (B,H,D); slots is a Python list of D distinct integers in [0,width). Return
    floating (B,H,width) actions and bool (width,) validity. mask_actions accepts a sequence and a (width,)
    bool mask. Unused slots are zero; preserve action gradients.
