  goal_en: 'RT-2 Action-Vocabulary Constrained Decoding: implement the interfaces below and verify numerical,
    boundary and experimental behavior.'
  scope: 实现机器人任务与视觉语言任务共享logits时的输出约束；动作token集合由调用者提供，不运行PaLI-X、PaLM-E或语义推理。
  scope_en: Implement output constraints for robot and vision-language rows sharing logits; callers supply
    action-token identities. Omit PaLI-X, PaLM-E and semantic reasoning.
  required_functions:
  - action_probabilities
  provided_functions: []
  optional: false
functions:
- name: action_probabilities
  signature: 'action_probabilities(logits: Tensor, action_tokens: Tensor, is_robot: Tensor) -> Tensor'
conventions:
  seed: 42
  device: CPU float32/float64; no downloads; preserve floating dtype/device; do not mutate inputs
  contract: Logits are (B,V), action_tokens is bool (V,) with at least one true, is_robot bool (B,). Robot
    rows allow action tokens only; other rows allow the full vocabulary.
