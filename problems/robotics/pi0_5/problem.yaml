functions:
- name: hybrid_attention_mask
  signature: 'hybrid_attention_mask(valid: Tensor, prefix_length: int, fast_length: int) -> Tensor'
conventions:
  seed: 42
  device: CPU float32/float64; no downloads; preserve floating dtype/device; do not mutate inputs
  contract: Valid is bool (B,L), prefix_length>=1, fast_length>=0 and at least one expert token remains.
    Return bool (B,L,L), rows=query, columns=key. FAST inputs are shifted teacher-forcing tokens and may
    attend themselves; expert attention is bidirectional but cannot see FAST.
