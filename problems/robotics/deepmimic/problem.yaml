module:
  goal: DeepMimic 四分量动作模仿奖励：实现下列接口并通过数值、边界和实验检查。
  goal_en: 'DeepMimic Four-Component Motion Imitation Reward: implement the interfaces below and verify
    numerical, boundary and experimental behavior.'
  scope: 实现姿态、角速度、末端与质心四项模仿奖励；姿态输入为预先计算的四元数测地角误差，不实现PPO、姿态解析或物理仿真。
  scope_en: Implement pose, angular-velocity, end-effector and center-of-mass imitation rewards. Pose
    inputs are precomputed quaternion geodesic angle errors; omit PPO, pose parsing and physical simulation.
  required_functions:
  - imitation_reward
  provided_functions: []
  optional: false
functions:
- name: imitation_reward
  signature: 'imitation_reward(pose_angles: Tensor, velocity_errors: Tensor, end_errors: Tensor, com_errors:
    Tensor) -> Tensor'
conventions:
  seed: 42
  device: CPU float32/float64; no downloads; preserve floating dtype/device; do not mutate inputs
  contract: Pose angles are (B,J) in [0,pi], velocity_errors (B,J,3), end_errors (B,E,3), com_errors (B,3),
    same dtype/device. Return (B,) rewards without batch averaging. Preserve error gradients.
