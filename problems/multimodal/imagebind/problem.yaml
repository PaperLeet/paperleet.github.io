functions:
- name: image_anchor_loss
  signature: 'image_anchor_loss(images: Tensor, modalities: Tensor, temperature: Tensor)
    -> Tensor'
  returns: images is [B,D] and modalities [M,B,D], with positive dimensions. Every
    modality is paired with the same image batch; do not add direct losses between
    nonimage modalities. Normalize features, compute bidirectional batch-softmax losses
    per image-modality pair, and average over M. temperature is a positive scalar.
    This teaching kernel permits image gradients; freezing the image encoder is the
    caller’s responsibility.
