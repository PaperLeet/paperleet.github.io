toy:
  kind: teaching_adaptation
  source: https://arxiv.org/abs/2303.15343
  anchor: Section 3.2 and Algorithm 1
  adaptation: 120 deterministic CPU gradient steps on four paired embedding vectors,
    log scale and bias; no pretrained towers or dataset benchmark.
