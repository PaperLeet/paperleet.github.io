id: multimodal/siglip
number: 118
paper_id: siglip
title: SigLIP 图文成对 Sigmoid 对齐
title_en: SigLIP Pairwise Image-Text Alignment
paper:
  title: Sigmoid Loss for Language Image Pre-Training
  authors: Xiaohua Zhai, Basil Mustafa, Alexander Kolesnikov, Lucas Beyer
  venue: ICCV 2023 Oral
  arxiv: '2303.15343'
  url: https://arxiv.org/abs/2303.15343
  anchors:
  - 'Section 3.2: pairwise sigmoid loss'
  - 'Algorithm 1: normalized embeddings, exponential scale, additive bias and batch
    normalization'
functions:
- name: pairwise_logits
  signature: 'pairwise_logits(images: Tensor, texts: Tensor, log_scale: Tensor, bias:
    Tensor) -> Tensor'
  returns: (B,B) Tensor of calibrated cosine logits; preserve dtype/device and gradients
    into both feature batches, log_scale and bias.
- name: siglip_loss
  signature: 'siglip_loss(logits: Tensor) -> Tensor'
  returns: 'Scalar Tensor: sum stable logistic losses over B*B pairs and divide by
    B; diagonal pairs positive.'
module:
  goal: 实现归一化图文相似度与成对 sigmoid 目标，训练匹配关系。
  goal_en: Implement normalized image-text similarities and the pairwise sigmoid objective
    to learn matching pairs.
  scope: 逐行 L2 归一化、可学习温度与偏置、按 batch 归约的稳定损失，以及四对合成向量训练。
  scope_en: Row-wise L2 normalization, learnable scale and bias, stable batch-normalized
    loss, and training on four synthetic pairs.
  required_functions:
  - pairwise_logits
  - siglip_loss
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; all floating inputs share dtype/device; no mutation
  features: images and texts both have nonempty (B,D) shape; pair i is image i and
    text i
  normalization: Divide each feature row by max(L2 norm, 1e-12); zero rows remain
    zero
  calibration: log_scale and bias are scalar tensors; logits=exp(log_scale)*cosine+bias;
    finite exponential scale required
  labels: Diagonal +1, off-diagonal -1; every pair participates
  reduction: Sum B*B pair losses and divide by B, not B squared
  autograd: Both towers and both calibration scalars receive gradients; logits are
    never detached
estimated_minutes: 30
tags:
- Multimodal
- Vision-Language
- Sigmoid Loss
- Contrastive Learning
