functions:
- name: masked_patch_distillation
  signature: 'masked_patch_distillation(student: Tensor, teacher_prob: Tensor, mask:
    Tensor, temperature: float) -> Tensor'
  returns: student and teacher_prob have shape [B,P,K]. Teacher probabilities are
    nonnegative and sum to one over K; teacher projection and normalization are already
    done. mask is boolean [B,P] with at least one selected patch. temperature is a
    positive Python float. Average cross-entropy only over masked patches, stop teacher
    gradients, and preserve student gradients.
module:
  goal: SigLIP 2 掩码 Patch 自蒸馏
  goal_en: SigLIP 2 masked patch self-distillation
  scope: 实现 SigLIP 2 辅助掩码预测中的概率蒸馏核；teacher 概率已给定，不实现 EMA 编码器、增强、投影头或完整多目标训练。
  scope_en: Implement the probability-distillation kernel of SigLIP 2 masked prediction
    with supplied teacher targets; exclude EMA encoders, augmentation, projection
    heads, and the full training recipe.
  required_functions:
  - masked_patch_distillation
  provided_functions: []
  optional: false
