functions:
- name: pack_visual_tokens
  signature: 'pack_visual_tokens(text: Tensor, visual: Tensor, labels: Tensor, image_index:
    int) -> tuple[Tensor, Tensor]'
  returns: 'One sequence: text is [T,D] with one image placeholder, visual is projected
    [P,D], and labels is int64 [T]. Replace the token at image_index with all P visual
    tokens; fill their labels with -100 and retain all other labels. Return length
    T+P-1 embeddings and labels. Gradients reach retained text and visual features;
    the removed placeholder receives zero gradient.'
module:
  goal: LLaVA 视觉 Token 注入与标签对齐
