  scope: 单图单样本的视觉序列打包与监督标签对齐；输入特征已经投影，不实现视觉编码器、语言模型或训练数据构建。
  scope_en: Pack one image into one sample and align supervision labels; features
    are already projected, excluding the vision encoder, language model, and data
    construction.
