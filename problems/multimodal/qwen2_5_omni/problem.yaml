  scope: 两秒块内视频优先的流交错和 40ms 时间格映射；不包含音视频编码器、Thinker–Talker 或语音波形生成。
  scope_en: Video-first stream interleaving within two-second chunks and a shared
    40 ms temporal grid; exclude audiovisual encoders, Thinker–Talker, and waveform
    generation.
