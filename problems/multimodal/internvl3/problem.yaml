functions:
- name: variable_visual_positions
  signature: 'variable_visual_positions(visual: Tensor, image_ids: Tensor, deltas:
    Tensor) -> Tensor'
  returns: visual is boolean [L]; image_ids is int64 [L], using an image ID in [0,M)
    for visual tokens and -1 for text. deltas is floating [M] with 0<delta<=1. All
    tokens of an image share its delta. Start at p_-1=-1 and add 1 for the current
    text token or its image delta for the current visual token. Return [L] with deltas
    dtype/device. Empty sequences and text-only M=0 are valid; preserve delta gradients.
module:
  goal: InternVL3 可变视觉位置增量
  goal_en: InternVL3 variable visual position increments
  scope: 每图像可变增量的位置递推、跨模态累计与梯度；原点明确固定为 -1，不实现完整旋转嵌入或 InternVL 训练。
  scope_en: Per-image position increments, cumulative multimodal offsets, and gradients
    with an explicit origin of -1; exclude full rotary embeddings and InternVL training.
  required_functions:
  - variable_visual_positions
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; metadata indices are int64
  contract: visual is boolean [L]; image_ids is int64 [L], using an image ID in [0,M)
    for visual tokens and -1 for text. deltas is floating [M] with 0<delta<=1. All
    tokens of an image share its delta. Start at p_-1=-1 and add 1 for the current
    text token or its image delta for the current visual token. Return [L] with deltas
    dtype/device. Empty sequences and text-only M=0 are valid; preserve delta gradients.
  mutation: Inputs are never modified in place
