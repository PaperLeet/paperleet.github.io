  scope: 动态分辨率下的窗口分组、空间合并顺序与累计长度；不实现完整 ViT 或 GPU 内核。
  scope_en: Window grouping, spatial-merge ordering, and cumulative lengths for dynamic
    resolutions; exclude the complete ViT and GPU kernels.
