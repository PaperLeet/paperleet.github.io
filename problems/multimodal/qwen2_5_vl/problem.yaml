functions:
- name: window_permutation
  signature: 'window_permutation(frames: int, height: int, width: int, merge_size:
    int, window_size: int) -> tuple[Tensor, Tensor]'
  returns: All arguments are positive integers. height/width describe the original
    patch grid and are divisible by merge_size; window_size counts merged cells. Iterate
    frames, window rows/columns, merged-cell rows/columns within a window, then patch
    rows/columns within a cell. Return original row-major patch indices without boundary
    padding. Outputs are CPU int64 permutation [T*H*W] and cu_seqlens counted in original
    patches, starting at zero.
