paper:
  title: 'Chameleon: Mixed-Modal Early-Fusion Foundation Models'
  authors: Chameleon Team
  venue: arXiv 2024
  arxiv: '2405.09818'
  url: https://arxiv.org/abs/2405.09818
  anchors:
  - Section 2.3 Stability; ChameleonLayerNorm computes statistics only over head_dim
functions:
- name: qk_layer_norm
  signature: 'qk_layer_norm(x: Tensor, weight: Tensor, bias: Tensor, eps: float) ->
    Tensor'
  returns: x is [T,H,D]; weight/bias are [H,D]. Compute mean and population variance
    only over the last dimension D for each token/head; add positive eps inside the
    square root. Affine parameters are independent per head. Preserve all input gradients.
    Apply this kernel separately to queries and keys; RoPE and full multimodal generation
    are excluded.
module:
  goal: Chameleon 逐头 QK LayerNorm
  goal_en: Chameleon per-head query-key LayerNorm
  scope: 逐头 LayerNorm 的统计轴、总体方差和仿射参数；用注意力熵实验观察输入范数增长下的稳定性。
  scope_en: Per-head LayerNorm statistics, population variance, and affine parameters,
    with an attention-entropy experiment under growing input norms.
  required_functions:
  - qk_layer_norm
  provided_functions: []
  optional: false
