functions:
- name: momentum_target_loss
  signature: 'momentum_target_loss(logits: Tensor, teacher_logits: Tensor, positives:
    Tensor, alpha: float) -> Tensor'
  returns: logits and teacher_logits are [B,N], where N may include queued negatives.
    positives is int64 [B] of positive columns. alpha is in [0,1]; targets mix alpha*teacher_softmax
    with (1-alpha)*one_hot. Stop teacher gradients and average over B, not B*N. Inputs
    are already temperature-scaled.
module:
  goal: BLIP 动量软目标混合
  goal_en: BLIP momentum soft-target mixing
  scope: 实现 BLIP 一个检索方向的动量软标签蒸馏；支持非方形负样本队列，不实现队列更新、动量编码器或 CapFilt 数据生成。
  scope_en: Implement BLIP momentum soft-target distillation for one retrieval direction
    with rectangular negative queues; omit queue updates, momentum encoders, and CapFilt
    data generation.
  required_functions:
  - momentum_target_loss
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; metadata indices are int64
  contract: logits and teacher_logits are [B,N], where N may include queued negatives.
    positives is int64 [B] of positive columns. alpha is in [0,1]; targets mix alpha*teacher_softmax
    with (1-alpha)*one_hot. Stop teacher gradients and average over B, not B*N. Inputs
    are already temperature-scaled.
  mutation: Inputs are never modified in place
