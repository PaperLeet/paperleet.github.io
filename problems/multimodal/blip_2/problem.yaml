  signature: 'max_query_similarity(queries: Tensor, texts: Tensor, temperature: Tensor)
    -> Tensor'
  returns: queries is [B,Q,D], texts is [N,D], and temperature is a positive scalar.
    Normalize along D and return [B,N] by maximizing independently over Q for every
    image-text pair. At ties, use torch.max first-index gradients. This kernel does
    not implement the full Q-Former.
