functions:
- name: gated_media_attention
  signature: 'gated_media_attention(x: Tensor, keys: Tensor, values: Tensor, text_media:
    Tensor, visual_media: Tensor, gate: Tensor) -> Tensor'
  returns: x is [T,D], keys/values are [N,D], and text_media/visual_media are int64
    [T]/[N]. Media IDs start at 1; each text ID names its immediately preceding medium,
    with 0 for no medium. Only matching IDs are visible; rows without visible media
    return x exactly. gate is scalar and scales the residual through tanh. Use one
    head and identity projections, without Perceiver or FFN.
module:
  goal: Flamingo 媒体因果门控注意力
  goal_en: Flamingo media-causal gated attention
  scope: 最近媒体掩码、无媒体行的安全 softmax 和零初始化 tanh 门控；简化为单头恒等投影的交叉注意力。
  scope_en: Immediately preceding media masks, safe softmax for rows without media,
    and zero-initialized tanh gating in single-head identity-projection cross-attention.
  required_functions:
  - gated_media_attention
  provided_functions: []
  optional: false
conventions:
  seed: 42
  dtype: CPU float32/float64; metadata indices are int64
  contract: x is [T,D], keys/values are [N,D], and text_media/visual_media are int64
    [T]/[N]. Media IDs start at 1; each text ID names its immediately preceding medium,
    with 0 for no medium. Only matching IDs are visible; rows without visible media
    return x exactly. gate is scalar and scales the residual through tanh. Use one
    head and identity projections, without Perceiver or FFN.
  mutation: Inputs are never modified in place
