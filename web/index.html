<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Practice AI research algorithms, implement papers in Python, and prepare for machine learning interviews with PaperLeet." />
    <title>PaperLeet - LeetCode for AI Researchers</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperLeet" />
    <meta property="og:title" content="PaperLeet - LeetCode for AI Researchers" />
    <meta property="og:description" content="Practice AI research algorithms, implement papers in Python, and prepare for machine learning interviews with PaperLeet." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PaperLeet - LeetCode for AI Researchers" />
    <meta name="twitter:description" content="Practice AI research algorithms, implement papers in Python, and prepare for machine learning interviews with PaperLeet." />
    <meta name="application-name" content="PaperLeet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html { background: #f5f6fa; color: #252525; }
      html[data-theme="dark"] { background: #1a1a1a; color: #efeff1; }
      .startup-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 15px/1.65 system-ui, sans-serif; }
      .startup-card { width: 100%; max-width: 440px; }
      .startup-card h1 { font-size: 24px; margin: 12px 0; }
      .startup-card p { margin: 12px 0; }
      .startup-card a, .startup-card button { display: inline-block; font: inherit; color: inherit; border: 1px solid currentColor; border-radius: 6px; padding: 8px 16px; background: transparent; cursor: pointer; text-decoration: none; }
      .startup-card [hidden] { display: none; }
    </style>
    <script>
      // Apply a validated preference before the page paints or the app loads.
      (() => {
        let theme;
        try {
          const saved = localStorage.getItem("paperleet.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        if (!theme) {
          try {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch {
            theme = "light";
          }
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#1a1a1a" : "#ffffff";
      })();
    </script>
    <script id="app-startup">
      (() => {
        let ready = false, failed = false, slow = false;
        const language = typeof navigator === 'undefined' ? 'en' : navigator.languages?.[0] || navigator.language || 'en';
        let english = !/^zh(?:-|$)/i.test(language);
        try {
          const saved = localStorage.getItem('paperleet.locale');
          if (saved === 'zh' || saved === 'en') english = saved === 'en';
        } catch {}
        function update() {
          if (ready) return;
          const title = document.getElementById('startup-title');
          const message = document.getElementById('startup-message');
          const retry = document.getElementById('startup-retry');
          if (!title || !message || !retry) return;
          title.textContent = failed
            ? (english ? 'The page could not load' : '页面暂时无法加载')
            : (english ? 'Opening PaperLeet…' : '正在打开 PaperLeet…');
          message.textContent = failed
            ? (english ? 'A page resource could not be loaded. Reload to try again.' : '页面资源未能加载，请重新加载后再试。')
            : slow
              ? (english ? 'Loading is taking longer than expected. You can reload to try again.' : '加载时间较长，可以重新加载后再试。')
              : (english ? 'Loading the page. Please wait.' : '正在加载页面，请稍候。');
          retry.textContent = english ? 'Reload page' : '重新加载';
          retry.hidden = !failed && !slow;
          const url = new URL(location.href);
          url.searchParams.set('_paperleet_reload', String(Date.now()));
          retry.href = url.href;
        }
        function fail(event) {
          if (ready) return;
          if (event.type === 'error' && event.target !== window && event.target?.tagName !== 'SCRIPT') return;
          failed = true;
          update();
        }
        const timer = setTimeout(() => { slow = true; update(); }, 10000);
        function finish() {
          ready = true;
          clearTimeout(timer);
          window.removeEventListener('error', fail, true);
          window.removeEventListener('unhandledrejection', fail);
          document.removeEventListener('DOMContentLoaded', update);
          document.removeEventListener('paperleet:ready', finish);
        }
        window.addEventListener('error', fail, true);
        window.addEventListener('unhandledrejection', fail);
        document.addEventListener('DOMContentLoaded', update);
        document.addEventListener('paperleet:ready', finish);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup-screen">
        <section class="startup-card" aria-labelledby="startup-title">
          <strong>PaperLeet</strong>
          <h1 id="startup-title">Opening PaperLeet…</h1>
          <p id="startup-message" role="status">Loading the page. Please wait.</p>
          <a id="startup-retry" href="?reload=1" hidden>Reload page</a>
          <noscript><p>Please enable JavaScript and reload.</p></noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
