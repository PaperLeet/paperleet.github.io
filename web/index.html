<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="PaperLeet - LeetCode for AI Researchers. Practice research algorithms, implement papers in Python, and prepare for machine learning interviews." />
    <title>PaperLeet - LeetCode for AI Researchers</title>
    <link rel="canonical" href="https://paperleet.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperLeet" />
    <meta property="og:url" content="https://paperleet.com/" />
    <meta property="og:title" content="PaperLeet - LeetCode for AI Researchers" />
    <meta property="og:description" content="PaperLeet - LeetCode for AI Researchers. Practice research algorithms, implement papers in Python, and prepare for machine learning interviews." />
    <meta property="og:image" content="https://paperleet.com/brand/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PaperLeet - LeetCode for AI Researchers" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://paperleet.com/brand/social-card.png" />
    <meta name="twitter:title" content="PaperLeet - LeetCode for AI Researchers" />
    <meta name="twitter:description" content="PaperLeet - LeetCode for AI Researchers. Practice research algorithms, implement papers in Python, and prepare for machine learning interviews." />
    <meta name="application-name" content="PaperLeet" />
    <link rel="icon" type="image/x-icon" sizes="32x32 48x48 96x96" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PaperLeet",
        "url": "https://paperleet.com/"
      }
    </script>
    <style>
      /* Boot colours match the theme tokens so the swap to the real shell does not jump. */
      html { background: #f7f8fa; color: #262626; --startup-bar: #fff; --startup-line: #e5e5e5; --startup-muted: #5c5c5c; }
      html[data-theme="dark"] { background: #1a1a1a; color: #eff1f6; --startup-bar: #262626; --startup-line: #3d3d3d; --startup-muted: #a8a8ad; }
      body { margin: 0; }
      .startup-screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; box-sizing: border-box; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif; }
      .startup-bar { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 calc(max(0px, (100% - 1480px) / 2) + clamp(16px, 2.8vw, 40px)); box-sizing: border-box; border-bottom: 1px solid var(--startup-line); background: var(--startup-bar); font-size: 20px; font-weight: 700; letter-spacing: -.4px; }
      .startup-card { box-sizing: border-box; width: 100%; max-width: 440px; margin: auto; padding: 24px; text-align: center; }
      .startup-spinner { display: inline-block; width: 20px; height: 20px; box-sizing: border-box; border: 2px solid #8883; border-top-color: #ffa116; border-radius: 50%; animation: startup-spin .7s linear infinite; }
      .startup-card:has(#startup-retry:not([hidden])) .startup-spinner { display: none; }
      .startup-card h1 { margin: 12px 0 4px; font-size: 16px; font-weight: 600; }
      .startup-card p { margin: 4px 0 12px; color: var(--startup-muted); font-size: 14px; }
      .startup-card .startup-brand { color: inherit; font-size: 20px; font-weight: 700; }
      .startup-card h1 .startup-english { font-size: 14px; }
      .startup-card a, .startup-card button { display: inline-block; font: inherit; font-size: 14px; font-weight: 600; color: inherit; border: 1px solid var(--startup-line); border-radius: 8px; padding: 6px 14px; background: var(--startup-bar); cursor: pointer; text-decoration: none; }
      .startup-card [hidden] { display: none; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .startup-spinner { animation-duration: 2s; } }
      /* Phones and tablets: the identity row plus the space the scrolling navigation will take. */
      @media (max-width: 860px) { .startup-bar { height: 89px; padding: 0 24px 40px; } }
      @media (max-width: 760px) { .startup-bar { padding-inline: 12px; font-size: 0; } }
    </style>
    <script>
      // Apply a validated preference before the page paints or the app loads.
      (() => {
        let theme;
        try {
          const saved = localStorage.getItem("paperleet.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        if (!theme) {
          try {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch {
            theme = "light";
          }
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#1a1a1a" : "#ffffff";
      })();
    </script>
    <script id="app-startup">
      (() => {
        let ready = false, failed = false, slow = false;
        const language = typeof navigator === 'undefined' ? 'en' : navigator.languages?.[0] || navigator.language || 'en';
        let english = !/^zh(?:-|$)/i.test(language);
        try {
          const saved = localStorage.getItem('paperleet.locale');
          if (saved === 'zh' || saved === 'en') english = saved === 'en';
        } catch {}
        function update() {
          if (ready) return;
          const title = document.getElementById('startup-title');
          const message = document.getElementById('startup-message');
          const retry = document.getElementById('startup-retry');
          if (!title || !message || !retry) return;
          title.textContent = failed
            ? (english ? 'The page could not load' : '页面暂时无法加载')
            : (english ? 'Opening PaperLeet…' : '正在打开 PaperLeet…');
          message.textContent = failed
            ? (english ? 'A page resource could not be loaded. Reload to try again.' : '页面资源未能加载，请重新加载后再试。')
            : slow
              ? (english ? 'Loading is taking longer than expected. You can reload to try again.' : '加载时间较长，可以重新加载后再试。')
              : (english ? 'Loading the page. Please wait.' : '正在加载页面，请稍候。');
          retry.textContent = english ? 'Reload page' : '重新加载';
          retry.hidden = !failed && !slow;
          const url = new URL(location.href);
          url.searchParams.set('_paperleet_reload', String(Date.now()));
          retry.href = url.href;
        }
        function fail(event) {
          if (ready) return;
          if (event.type === 'error' && event.target !== window && event.target?.tagName !== 'SCRIPT') return;
          failed = true;
          update();
        }
        const timer = setTimeout(() => { slow = true; update(); }, 10000);
        function finish() {
          ready = true;
          clearTimeout(timer);
          window.removeEventListener('error', fail, true);
          window.removeEventListener('unhandledrejection', fail);
          document.removeEventListener('DOMContentLoaded', update);
          document.removeEventListener('paperleet:ready', finish);
        }
        window.addEventListener('error', fail, true);
        window.addEventListener('unhandledrejection', fail);
        document.addEventListener('DOMContentLoaded', update);
        document.addEventListener('paperleet:ready', finish);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup-screen">
        <div class="startup-bar" aria-hidden="true"><img src="/favicon.png" width="28" height="28" alt="" />PaperLeet</div>
        <section class="startup-card" aria-labelledby="startup-title">
          <span class="startup-spinner" aria-hidden="true"></span>
          <h1 id="startup-title">Opening PaperLeet…</h1>
          <p id="startup-message" role="status">Loading the page. Please wait.</p>
          <a id="startup-retry" href="?reload=1" hidden>Reload page</a>
          <noscript><p>Please enable JavaScript and reload.</p></noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
